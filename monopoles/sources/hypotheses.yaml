# Registre des hypothèses (H-xx) — méthode Métabolisme, INTRO §9.
# Deux formes : les PARAMÈTRES chiffrés (valeur centrale, plage plausible,
# unité — même schéma que logement/sources/hypotheses.yaml) et les hypothèses
# QUALITATIVES (`statement`, sans valeur numérique — forme acceptée par le
# contrat du site depuis le 2026-09-04 ; le schéma pydantic de `logement` ne
# la connaît pas, voir monopoles/CLAUDE.md).
#
# Règles adoptées après la revue contradictoire (2026-09-05, HD-7, CR-7) :
# - `justification` ne contient que des sources (S), observations (O) ou
#   interprétations (I) ; une définition ou un choix ne justifie pas un
#   énoncé empirique ; les limites vont dans `limitations`. Vide = honnête.
# - `confidence` : `medium` seulement si au moins une observation figée
#   porte la valeur ou l'énoncé ; `low` sinon.
# - chaque hypothèse qualitative dit ce qui la RÉFUTERAIT.
#
# H-01..H-05 : hypothèses directrices du cadrage (INTRO.md §7).
# H-06..H-08 : paramètres et ordre de grandeur (H-07 est désormais qualitative).
# H-09..H-20 : hypothèses de classement de l'inventaire, une par ligne (INTRO
# §8), dont deux lignes témoins où Q1 ne répond pas « non duplicable ».
# Aucun résultat (R-xx) n'existe encore : `affects` est vide.

# ------------------------------------------------------ directrices

- id: H-01
  name: price_cost_decoupling_where_not_duplicable
  description: >
    Là où l'infrastructure n'est pas duplicable (ou la ressource fixe) ET où
    le prix n'est pas administré, le prix payé par l'usager se décorrèle
    durablement du coût de fourniture efficace (hypothèse directrice H-01).
  statement: >
    Périmètre : secteurs classés « non duplicable » ou « fixe » à Q1 (D-05,
    D-16) dont le prix d'accès n'est pas fixé par un régulateur — là où il
    l'est (transport d'électricité, accès fibre régulé), le prix couvre par
    construction coût efficace + rémunération reconnue (S-07, L. 341-2) et
    l'hypothèse n'a pas d'objet. Test : la rente mesurable D-15, aux deux
    bornes de H-06, est positive et ne décroît pas sur dix ans, ALORS qu'un
    secteur ou segment témoin substituable, mesuré de la même façon, n'en
    montre pas. Réfutée si, sur un secteur du périmètre, la rente D-15 est
    nulle ou décroissante aux deux bornes, ou si le témoin substituable en
    montre autant. Les indices complémentaires — marges qui ne s'érodent
    pas, hausse sans réponse d'offre, écarts territoriaux qui se creusent —
    sont un faisceau d'indices (I-03), pas un test : chacun a des causes
    concurrentes (coûts fixes, prix administré, rareté réglementaire, cycle
    du crédit, divergence des revenus) que l'étude sectorielle doit
    contrôler. Sur le logement, le loyer rapporté au revenu est resté dans
    un tunnel de 20 % depuis 1975 alors que le prix de vente a décroché
    depuis 2002 (O-08) : la décorrélation ne porte que sur le prix des
    actifs, pas sur le prix payé par l'usager locataire — l'hypothèse doit
    y être formulée sur le prix d'acquisition et le rendement, pas sur le
    loyer.
  confidence: low
  justification:
    - O-08
  limitations:
    - L-11
  affects: []

- id: H-02
  name: concession_tendering_displaces_rent
  description: >
    La mise en concurrence des concessions déplace la rente sans la
    supprimer (hypothèse directrice H-02).
  statement: >
    Un appel d'offres ou une cession capture au mieux une fraction de la
    rente à l'instant de l'attribution ; les hausses de prix ultérieures,
    les gains de productivité non partagés et les renégociations reviennent
    au concessionnaire. Indices : sur les autoroutes, le taux de rémunération
    du capital reconnu par l'État a été renégocié de 6,5 % à 5,9 % en 2017
    (O-06), et les TRI actionnaires constatés en 2019 sont inférieurs aux
    TRI prévisionnels de 2006 (O-07) — ce qui montre qu'une part de la rente
    est captée ou disputée, pas qu'elle est supprimée. Réfutée si, mesurée
    selon D-15 sur une concession attribuée par mise en concurrence, la
    rente actualisée sur la vie du contrat est intégralement captée par le
    prix d'attribution et les redevances (dispositifs existants à tester :
    redevance hydroélectrique proportionnelle aux résultats, enchères de
    capacité), ou si les avenants successifs ont réduit la rente plutôt que
    l'augmenter.
  confidence: low
  justification:
    - O-06
    - O-07
  affects: []

- id: H-03
  name: regie_delegation_cost_comparison
  description: >
    À service, ressource, investissement et fiscalité comparables, la
    gestion déléguée coûte plus cher à l'usager que la régie (hypothèse
    directrice H-03).
  statement: >
    Hypothèse : à service comparable, le prix en délégation excède celui en
    régie. Ce que dit la source officielle (O-04) : le prix est en moyenne
    plus élevé en délégation, l'écart varie dans le temps et semble se
    réduire depuis 2010, et il s'explique d'abord par la SÉLECTION (les
    collectivités délèguent plus souvent les services complexes). Méthode
    imposée : l'écart brut (H-08) n'est pas une rente ; il faut le corriger
    de la sélection (méthodes d'effet de traitement, O-05), de la ressource
    et du traitement, de l'investissement (une régie qui renouvelle moins
    « coûte » moins : coût différé, pas rente), de la fiscalité (IS, TVA),
    du coût de la dette et de la qualité. Ce qui reste après correction est
    le candidat « ce que la délégation prélève », à rapprocher de D-15.
    Réfutée si l'écart corrigé est nul ou négatif, ou entièrement expliqué
    par l'investissement et la ressource.
  confidence: low
  justification:
    - O-04
    - O-05
  limitations:
    - L-06
  affects: []

- id: H-04
  name: open_regulated_stock_disciplines_rents
  description: >
    Sur le logement, un parc à loyers administrés ne discipline les loyers
    privés d'une ville que s'il est OUVERT (sans condition de ressources) et
    assez large ; un parc réservé loge moins cher sans réguler (hypothèse
    directrice H-04).
  statement: >
    La variable n'est pas la part du parc social dans le parc locatif —
    l'étude a elle-même relevé que la France se situe entre un tiers et
    43 % du locatif sans que les loyers privés soient disciplinés, et que
    le parc viennois est à une part comparable (INTRO §12) — mais son
    OUVERTURE : plafonds de ressources hauts ou absents, absence de
    rationnement (files d'attente), inaliénabilité. Le seuil de part ouverte
    au-delà duquel le parc devient faiseur de prix est H-07, sans valeur
    numérique tant qu'aucune estimation n'existe (L-03). Réfutée si, à
    revenu et tension comparables, aucune relation dose-réponse n'apparaît
    entre la part du parc ouvert à loyer administré et le niveau des loyers
    privés ; ou si un encadrement des loyers sans parc obtient le même
    effet (configuration à comparer, C-03). Base empirique à ENREGISTRER
    avant tout usage : les sources de la note privée « Le parc social,
    fonction régulatrice ou logique volumétrique ? » (SDES, Insee, Ancols,
    Ville de Vienne, Statistik Austria, OLAP) ne sont pas dans ce registre
    (CR-3) — l'étude sectorielle « logement » les figera ou s'adossera à
    `logement/`.
  confidence: low
  justification: []
  limitations:
    - L-03
  affects: []

- id: H-05
  name: system_cost_organisation_open_question
  description: >
    Le coût système d'un réseau électrique (back-up pilotable, stockage,
    renforcement, gestion de l'intermittence) serait mieux optimisé par un
    opérateur intégré que par un marché fragmenté (hypothèse directrice
    H-05, non fondée à ce stade).
  statement: >
    Énoncé repris de la note d'origine, sans source ni observation qui le
    porte : la version antérieure le justifiait par des définitions et par
    l'ordre des études, ce qui ne justifie rien (HD-7, SE-11). Il confond
    deux choses : l'existence d'un coût système (réelle, et liée aux
    économies d'envergure D-18 que la séparation des niveaux peut perdre)
    et la forme d'organisation qui le minimise (question ouverte — un
    opérateur intégré a aussi produit des dépassements de coûts documentés,
    à figer par l'étude sectorielle). Traitée comme QUESTION DE RECHERCHE
    de l'étude « électricité » (C-04, en dernier) : observable = coût
    système par MWh livré sous chaque organisation, à design comparable.
    Réfutée si le coût système est égal ou plus bas dans les systèmes
    fragmentés à mix comparable.
  confidence: low
  justification: []
  affects: []

# ------------------------------------------------ paramètres et ordres de grandeur

- id: H-06
  name: reference_return_on_capital
  description: >
    Taux de RÉFÉRENCE de rémunération du capital, commun à toutes les
    études sectorielles, appliqué à la base d'actifs de D-15 pour mesurer
    le surprofit : la rente mesurée est l'excédent sur le rendement qu'un
    régulateur français accorderait à un réseau à faible risque. Valeur
    centrale 5,0 % nominal avant impôts — deux régulateurs indépendants
    convergent : la CRE pour RTE au TURPE 7 (O-01) et l'ARCEP pour les
    activités fixes régulées à compter de 2026 (O-02). Borne basse 4,0 % :
    sous le TURPE 6 (4,6 %, O-01). Borne haute 8,8 % : haut de l'intervalle
    de confiance du TRI projet des concessions autoroutières estimé par
    l'ART ([5,3 % ; 8,8 %], O-03), qui porte un risque de trafic. Chaque
    étude sectorielle présente sa mesure AUX DEUX BORNES et enregistre en
    plus le taux propre reconnu par le régulateur de son secteur (ARCEP,
    ART, CRE) : un taux de référence commun rend les mesures comparables,
    le taux sectoriel les rend justes. Limite (D-13, HD-2) : sur un secteur
    régulé, la mesure à ce taux est nulle par construction ; ce taux est un
    jugement de régulateur, pas un prix de marché.
  central_value: 5.0
  plausible_range: [4.0, 8.8]
  unit: "% nominal avant impôts"
  confidence: medium
  justification:
    - O-01
    - O-02
    - O-03
  limitations:
    - L-11
  affects: []

- id: H-07
  name: open_stock_price_maker_threshold
  description: >
    Part du parc locatif d'une ville OUVERT à tout ménage sans condition de
    ressources et à loyer administré, au-delà de laquelle ce parc devient
    faiseur de prix sur les loyers privés (seuil de bascule de H-04).
  statement: >
    Dénominateur : le parc locatif de la ville ; numérateur : les logements
    à loyer administré accessibles sans plafond de ressources (ou à plafond
    couvrant l'essentiel de la population) et sans rationnement durable. La
    France est alors proche de zéro ; Vienne, dont le parc municipal et
    coopératif est ouvert à la plupart des ménages, proche de sa part
    totale — c'est ce que la variable doit capter, là où l'ancienne
    formulation (« 35 % [30 ; 40] du parc locatif », reprise de la note
    d'origine) plaçait la France DANS la plage sans qu'elle soit faiseur de
    prix (HD-5, CR-4). Aucune valeur numérique tant qu'aucune estimation de
    l'élasticité des loyers privés à cette part n'existe (L-03). Réfutée si
    aucune relation dose-réponse n'apparaît (voir H-04).
  confidence: low
  justification: []
  limitations:
    - L-03
  affects: []

- id: H-08
  name: water_delegation_gross_price_gap
  description: >
    Écart BRUT de prix entre gestion déléguée et régie pour un service
    d'eau, non corrigé de la sélection ni des différences de ressource,
    d'investissement et de fiscalité — ordre de grandeur d'entrée pour
    l'étude sectorielle « eau », PAS une mesure de rente.
  central_value: 10.0
  plausible_range: [0.0, 27.0]
  unit: "% du prix du service, écart brut délégation / régie"
  confidence: low
  justification:
    - O-04
    - O-05
  limitations:
    - L-06
  affects: []

