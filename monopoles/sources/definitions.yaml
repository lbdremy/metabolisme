# Registre des définitions (D-xx) — méthode Métabolisme, INTRO §8.
# Chaque définition est citée VERBATIM depuis sa page source, avec l'URL, la
# date de version et les limites connues. Les définitions anglophones (S-01,
# S-06) sont citées dans leur langue ; la traduction de travail est donnée
# en limite (L-07). Les notions construites par l'étude (D-03, D-05, D-07,
# D-08) sont rattachées au choix C-02 qui les formule et à la source qui
# les ancre. Même schéma que logement/sources/definitions.yaml
# (DefinitionRecord).

- id: D-01
  term: monopole naturel
  source: S-01
  url: https://www.oecd.org/content/dam/oecd/en/publications/reports/2008/09/oecd-glossary-of-statistical-terms_g1gh9ad7/9789264055087-en.pdf
  last_updated: 2008-08-13
  definition: >
    A natural monopoly exists in a particular market if a single firm can
    serve that market at lower cost than any combination of two or more
    firms. Natural monopoly arises out of the properties of productive
    technology, often in association with market demand, and not from the
    activities of governments or rivals (see monopoly). Generally speaking,
    natural monopolies are characterized by steeply declining long-run
    average and marginal-cost curves such that there is room for only one
    firm to fully exploit available economies of scale and supply the
    market.
  caveats:
    - "Traduction de travail : un monopole naturel existe sur un marché si une seule entreprise peut le servir à un coût inférieur à toute combinaison de deux entreprises ou plus ; il naît des propriétés de la technique de production, souvent combinées à la demande, et non de l'action des pouvoirs publics ou des concurrents."
    - "Entrée « Natural monopoly », index PDF 346 ; source citée par le glossaire : Khemani & Shapiro, OCDE, 1993. Le contexte de l'entrée ajoute que les monopoles naturels « are thought to exist in some portions of industries such as electricity, railroads, natural gas, and telecommunications » et « are typically subject to government regulation »."
    - "La définition est une propriété de coût (sous-additivité), pas une propriété de la demande ni de la propriété du réseau : elle dit qu'une seule entreprise doit produire, pas qui doit la posséder ni qui doit encaisser."
    - "Elle porte sur « a particular market » : la délimitation du marché (l'infrastructure seule, ou l'infrastructure et le service) est un choix de l'analyste — la grille (C-01) sépare les deux."

- id: D-02
  term: rente économique
  source: S-01
  url: https://www.oecd.org/content/dam/oecd/en/publications/reports/2008/09/oecd-glossary-of-statistical-terms_g1gh9ad7/9789264055087-en.pdf
  last_updated: 2008-08-13
  definition: >
    In modern economics, rent refers to the earnings of factors of
    production (land, labour, capital) which are fixed in supply. Thus,
    raising the price of such factors will not cause an increase in
    availability but will increase the return to the factor. This differs
    from the more common usage of the term, whereby rent refers to payments
    for the use of a resource. […] In the case of economic rents the
    supplier receives a payment in excess of the amount required to induce
    the supplier to supply the factor. […] When the availability of a good
    is artificially restricted (for example by laws limiting entry), then
    the increased earnings of the remaining suppliers are termed monopoly
    rents.
  caveats:
    - "Traduction de travail : la rente est le revenu d'un facteur de production dont l'offre est fixe ; en élever le prix n'en augmente pas la disponibilité, seulement le revenu de son détenteur. Dans le cas d'une rente économique, le fournisseur reçoit un paiement supérieur à ce qui serait nécessaire pour l'amener à fournir le facteur."
    - "Entrée « Rent - OECD », index PDF 452. L'entrée distingue la rente économique (facteur en offre fixe de façon permanente) de la quasi-rente (offre temporairement fixe, voir D-04) et de la rente de monopole (restriction artificielle de l'offre)."
    - "La définition n'est pas opératoire : elle ne dit pas comment mesurer « the amount required to induce the supplier to supply the factor ». La définition mesurable de l'étude — prix payé moins coût d'une fourniture efficace, rémunération normale du capital comprise — est un choix (C-02) dont le terme « normale » est le paramètre H-06."

- id: D-03
  term: rente de position (notion construite)
  source: S-02
  url: https://fr.wikisource.org/wiki/Des_principes_de_l%E2%80%99%C3%A9conomie_politique_et_de_l%E2%80%99imp%C3%B4t/Chapitre_2
  last_updated: null
  definition: >
    Rente tirée du contrôle d'une ressource que personne ne peut reproduire
    ni contourner — un réseau non duplicable, un site, une localisation,
    une fréquence, une orbite — et qui, pour cette raison, ne se dissipe
    pas par imitation ni par entrée de nouveaux offreurs. C'est la rente
    économique de D-02 lorsque le facteur en offre fixe est une position.
    Ancrage : Ricardo définit la rente comme « cette portion du produit de
    la terre que l'on paie au propriétaire pour avoir le droit d'exploiter
    les facultés productives et impérissables du sol ».
  caveats:
    - "Notion construite par l'étude (choix C-02) : la formulation n'est pas celle d'une source ; seule la citation de Ricardo l'est (S-02, ouverture du chapitre II, p. 38 de l'édition de 1847)."
    - "Ricardo pose la rente sur la fertilité différentielle des terres ; l'extension à la « position » (localisation, réseau, spectre) est une transposition assumée, courante dans l'économie urbaine et des réseaux, mais non tirée du texte."
    - "Se distingue de la rente de monopole au sens de D-02 (restriction ARTIFICIELLE de l'offre) : ici la fixité de l'offre est physique ou positionnelle, pas réglementaire — le cas du brevet, où elle est juridique, est hors périmètre (L-01)."

- id: D-04
  term: rente d'innovation (notion construite)
  source: S-01
  url: https://www.oecd.org/content/dam/oecd/en/publications/reports/2008/09/oecd-glossary-of-statistical-terms_g1gh9ad7/9789264055087-en.pdf
  last_updated: 2008-08-13
  definition: >
    Rente temporaire qui rémunère une découverte, une avance technique ou un
    risque pris, et qui se dissipe à mesure que d'autres offreurs reproduisent
    l'avancée. Ancrage : la quasi-rente du glossaire OCDE — « Economists use
    the term economic rent to denote the payment to factors which are
    permanently in fixed supply and quasi-rent to denote payments for
    factors which are temporarily in fixed supply. […] Quasi-rents exist
    when factors can be augmented over time ».
  caveats:
    - "Notion construite (C-02) : « rente d'innovation » est le nom donné par l'étude à la quasi-rente lorsque la fixité temporaire de l'offre vient d'une avance technique ; la citation est celle de l'entrée « Rent - OECD » (S-01, index PDF 452)."
    - "Traduction de travail : les économistes appellent rente économique le paiement aux facteurs dont l'offre est fixe de façon permanente, et quasi-rente le paiement aux facteurs dont l'offre n'est fixe que temporairement."
    - "Le glossaire ne parle pas d'innovation ni de Schumpeter ; le rapprochement est celui de l'étude. Le brevet, qui prolonge juridiquement la fixité de l'offre, brouille la frontière avec D-03 (L-01)."

- id: D-05
  term: substituabilité de l'infrastructure (notion construite)
  source: S-01
  url: https://www.oecd.org/content/dam/oecd/en/publications/reports/2008/09/oecd-glossary-of-statistical-terms_g1gh9ad7/9789264055087-en.pdf
  last_updated: 2008-08-13
  definition: >
    Une infrastructure est substituable s'il est possible d'en construire à
    coût raisonnable une seconde qui concurrence la première pour les mêmes
    usagers. Elle ne l'est pas lorsque, au sens de D-01, une seule
    infrastructure sert le marché à moindre coût que toute combinaison de
    deux ou plus (rareté physique), ou lorsque ce qu'elle procure tient à
    une localisation qui ne se reproduit pas (rareté positionnelle).
  caveats:
    - "Notion construite (C-02) : c'est la question Q1 de la grille, dérivée de la définition du monopole naturel (D-01) et étendue à la rareté positionnelle (D-03)."
    - "« Coût raisonnable » n'est pas quantifié ici : chaque étude sectorielle doit dire sur quoi elle fonde la non-substituabilité (coûts de duplication documentés, décision d'un régulateur, nature physique du site)."
    - "La substituabilité s'apprécie pour l'infrastructure, pas pour le service : un service satellitaire peut concurrencer la fibre alors que ni l'orbite ni la boucle locale ne sont substituables (INTRO §8)."

- id: D-06
  term: rivalité (d'un bien ou d'une capacité)
  source: S-06
  url: https://openstax.org/books/principles-economics-3e/pages/13-3-public-goods
  last_updated: 2022-12-14
  definition: >
    The second main characteristic of a public good, that it is non-rival,
    means that when one person uses the public good, another can also use
    it. With a private good like pizza, if Max is eating the pizza then
    Michelle cannot also eat it; that is, the two people are rivals in
    consumption. With a public good like national defense, Max's consumption
    of national defense does not reduce the amount left for Michelle, so
    they are non-rival in this area.
  caveats:
    - "Traduction de travail : un bien est rival lorsque sa consommation par une personne le rend indisponible pour une autre ; non rival lorsque l'usage de l'un n'ôte rien à l'autre."
    - "La grille (C-01, question Q2a) applique la notion à une UNITÉ DE CAPACITÉ du réseau (un sillon, un créneau, une place, un mètre cube), pas au réseau entier : un lien de fibre est presque non rival, un sillon ferroviaire est rival."
    - "Le manuel définit les biens publics par deux propriétés (non-exclusion et non-rivalité) ; seule la rivalité est reprise ici. L'exclusion est traitée séparément, par la captivité (D-08)."
    - "Manuel sous CC BY-NC-SA, attribution OpenStax requise (S-06)."

- id: D-07
  term: différenciabilité du bien livré (notion construite)
  source: S-06
  url: https://openstax.org/books/principles-economics-3e/pages/13-3-public-goods
  last_updated: 2022-12-14
  definition: >
    Un bien livré par un réseau est différenciable si l'usager peut
    distinguer, à l'arrivée, la fourniture d'un opérateur de celle d'un
    autre — par sa qualité, son contenu ou ses caractéristiques. Il ne
    l'est pas lorsque les unités livrées sont physiquement indistinguables
    (un kilowattheure, un mètre cube d'eau au robinet, une calorie de
    chaleur) : une concurrence entre fournisseurs porte alors sur la
    facturation, pas sur le produit.
  caveats:
    - "Notion construite (C-02), question Q2b de la grille. Aucune des sources figées ne la définit ; S-06 n'est cité que pour la notion voisine de bien « separate and identifiable » qui fonde l'exclusion (« you can buy and sell a piece of pizza fairly easily because it is a separate and identifiable item »)."
    - "La différenciabilité porte sur le bien tel qu'il arrive chez l'usager, pas sur l'origine de production : un électron n'a pas d'origine identifiable même si les producteurs diffèrent."

- id: D-08
  term: captivité de l'usager (notion construite)
  source: S-06
  url: https://openstax.org/books/principles-economics-3e/pages/13-3-public-goods
  last_updated: 2022-12-14
  definition: >
    Un usager est captif d'un réseau lorsque le coût de s'en détacher —
    changer de fournisseur, de source, d'installation ou de localisation —
    est prohibitif au regard du service, ou lorsque la décision de
    raccordement ou de sortie ne lui appartient pas (copropriété,
    collectivité). La captivité se mesure par le coût de sortie et par
    l'identité de celui qui décide.
  caveats:
    - "Notion construite (C-02), question Q3 de la grille ; voisine des « coûts de changement » (switching costs) de la littérature de régulation, entrée absente du glossaire OCDE figé (S-01)."
    - "Rattachée à S-06 pour le seul contraste avec l'exclusion : l'exclusion dit si le fournisseur peut écarter l'usager, la captivité dit si l'usager peut écarter le fournisseur."
    - "Ne change pas le classement Q1-Q2 ; change l'urgence de la protection et le poids de la durée des contrats (INTRO §5, Q3)."

- id: D-09
  term: concurrence pour le marché / concurrence sur le marché
  source: S-03
  url: https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000037703286
  last_updated: 2019-04-01
  definition: >
    La concurrence POUR le marché est la mise en compétition périodique du
    droit d'exploiter une infrastructure ou un service — en droit français,
    la passation d'un contrat de concession, « contrat par lequel une ou
    plusieurs autorités concédantes […] confient l'exécution de travaux ou
    la gestion d'un service à un ou plusieurs opérateurs économiques, à qui
    est transféré un risque lié à l'exploitation de l'ouvrage ou du service,
    en contrepartie soit du droit d'exploiter l'ouvrage ou le service qui
    fait l'objet du contrat, soit de ce droit assorti d'un prix » (D-10).
    La concurrence SUR le marché est la coexistence de plusieurs opérateurs
    servant simultanément des usagers différents sur la même infrastructure.
  caveats:
    - "La distinction est celle de la littérature économique (Demsetz, « Why regulate utilities? », 1968, non figé — accès payant) ; seule la partie juridique (concession) est citée verbatim, depuis S-03."
    - "La grille ajoute un troisième cas, distinct des deux : la délégation de l'exploitation et de l'entretien rémunérée au forfait, SANS transfert de la recette d'usage (INTRO §5, Q4). Ce n'est une concession au sens de D-10 que si un risque d'exploitation est transféré."
    - "Une concession transfère la recette et le risque : c'est ce qui en fait, pour l'étude, un transfert de rente (H-02) et non une simple délégation de travaux."

- id: D-10
  term: contrat de concession
  source: S-03
  url: https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000037703286
  last_updated: 2019-04-01
  definition: >
    Un contrat de concession est un contrat par lequel une ou plusieurs
    autorités concédantes soumises au présent code confient l'exécution de
    travaux ou la gestion d'un service à un ou plusieurs opérateurs
    économiques, à qui est transféré un risque lié à l'exploitation de
    l'ouvrage ou du service, en contrepartie soit du droit d'exploiter
    l'ouvrage ou le service qui fait l'objet du contrat, soit de ce droit
    assorti d'un prix. La part de risque transférée au concessionnaire
    implique une réelle exposition aux aléas du marché, de sorte que toute
    perte potentielle supportée par le concessionnaire ne doit pas être
    purement théorique ou négligeable. Le concessionnaire assume le risque
    d'exploitation lorsque, dans des conditions d'exploitation normales, il
    n'est pas assuré d'amortir les investissements ou les coûts, liés à
    l'exploitation de l'ouvrage ou du service, qu'il a supportés.
  caveats:
    - "Code de la commande publique, art. L1121-1, version en vigueur depuis le 01/04/2019 (création par l'ordonnance n° 2018-1074 du 26 novembre 2018)."
    - "Le critère juridique est le TRANSFERT DU RISQUE d'exploitation ; l'étude s'intéresse au transfert de la RECETTE, qui l'accompagne. Une concession sur un monopole naturel transfère un risque faible (usager captif) et une recette élevée : c'est l'asymétrie que mesurent les études sectorielles."
    - "Les concessions autoroutières historiques relèvent aussi du code de la voirie routière ; les concessions hydroélectriques du code de l'énergie — régimes spéciaux à figer par les études sectorielles."

- id: D-11
  term: régie (gestion directe d'un service public)
  source: S-04
  url: https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000051560771
  last_updated: 2025-05-03
  definition: >
    Les collectivités territoriales, leurs établissements publics, les
    établissements publics de coopération intercommunale ou les syndicats
    mixtes, pour l'exploitation directe d'un service public industriel et
    commercial relevant de leur compétence, constituent une régie soumise
    aux dispositions du chapitre Ier du titre II du livre II de la deuxième
    partie, le cas échéant, après avoir recueilli l'avis de la commission
    consultative des services publics locaux prévue à l'article L. 1413-1.
  caveats:
    - "CGCT, art. L1412-1, premier alinéa, version en vigueur depuis le 03/05/2025 (loi n° 2025-391 du 30 avril 2025, art. 24). Les alinéas suivants (régie unique eau / assainissement / eaux pluviales) ne sont pas repris."
    - "Complété par l'art. L2221-1 (version du 24/02/1996, S-04) : « Les communes et les syndicats de communes peuvent exploiter directement des services d'intérêt public à caractère industriel ou commercial. Sont considérées comme industrielles ou commerciales les exploitations susceptibles d'être gérées par des entreprises privées, soit par application de la loi des 2-17 mars 1791, soit, en ce qui concerne l'exploitation des services publics communaux, en vertu des contrats de concession ou d'affermage. »"
    - "La régie est la forme juridique de la « collectivisation » au niveau communal (eau, chaleur, stationnement) ; au niveau national, la forme est l'entreprise publique ou l'établissement public, hors de ces articles."

- id: D-12
  term: délégation de service public
  source: S-04
  url: https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000037739236
  last_updated: 2019-04-01
  definition: >
    Les collectivités territoriales, leurs groupements ou leurs
    établissements publics peuvent confier la gestion d'un service public
    dont elles ont la responsabilité à un ou plusieurs opérateurs
    économiques par une convention de délégation de service public définie
    à l'article L. 1121-3 du code de la commande publique préparée, passée
    et exécutée conformément à la troisième partie de ce code.
  caveats:
    - "CGCT, art. L1411-1, version en vigueur depuis le 01/04/2019 (ordonnance n° 2018-1074 du 26 novembre 2018, art. 6)."
    - "Depuis 2019 la DSP est une espèce du contrat de concession (D-10) : l'article renvoie à l'art. L1121-3 du code de la commande publique, non figé (S-03, notes). L'ancienne définition par la rémunération « substantiellement liée aux résultats de l'exploitation » n'est plus dans le texte."
    - "C'est le mode de gestion majoritaire de l'eau et des réseaux de chaleur ; la comparaison régie / délégation (H-03, H-08) porte sur ces deux formes."

- id: D-13
  term: coût moyen pondéré du capital reconnu par un régulateur (rendement régulé)
  source: S-07
  url: https://www.cre.fr/fileadmin/Documents/Deliberations/2025/250313_2025-77_Post-CSE_TURPE_7_HTB.pdf
  last_updated: 2025-03-13
  definition: >
    La CRE définit le coût moyen pondéré du capital (CMPC) sur la base
    d'une méthode à structure normative qui assure une rémunération
    raisonnable des capitaux investis. […] Compte tenu des valeurs retenues
    par la CRE pour les autres paramètres, le CMPC de RTE pour le TURPE 7
    HTB est de 5,0 % nominal, avant impôts.
  caveats:
    - "Délibération CRE n° 2025-77 du 13 mars 2025, section « Rémunération du capital » (index PDF 4) ; tableau de synthèse à l'index PDF 9 : 5,0 % (TURPE 7) contre 4,6 % (TURPE 6), prime de 0,5 % pour les actifs de raccordement des parcs éoliens en mer."
    - "Le CMPC rémunère la base d'actifs régulés (BAR) : charges de capital = amortissement + BAR × CMPC (index PDF 9). C'est la définition opératoire de la « rémunération normale du capital » d'un monopole régulé, et la base du paramètre H-06."
    - "Propre à RTE (transport d'électricité, risque faible, actifs longs) ; un concessionnaire autoroutier ou un délégataire d'eau n'a ni le même risque ni la même structure — H-06 porte une plage, pas ce seul point."

- id: D-14
  term: domaine public
  source: S-05
  url: https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000006361178
  last_updated: 2006-07-01
  definition: >
    Sous réserve de dispositions législatives spéciales, le domaine public
    d'une personne publique mentionnée à l'article L. 1 est constitué des
    biens lui appartenant qui sont soit affectés à l'usage direct du public,
    soit affectés à un service public pourvu qu'en ce cas ils fassent
    l'objet d'un aménagement indispensable à l'exécution des missions de ce
    service public.
  caveats:
    - "CG3P, art. L2111-1, version en vigueur depuis le 01/07/2006. Complété par l'art. L3111-1 (même date, S-05) : « Les biens des personnes publiques mentionnées à l'article L. 1, qui relèvent du domaine public, sont inaliénables et imprescriptibles. »"
    - "Un actif du domaine public concédé (voirie, sous-sol, autoroute) reste propriété publique : la collectivisation de la rente ne demande alors ni expropriation ni rachat de l'actif, seulement la fin ou la non-reconduction du contrat (INTRO §8, stationnement)."
    - "L'inaliénabilité vaut pour le bien, pas pour la recette : le domaine public peut être concédé et sa recette transférée (D-10)."
