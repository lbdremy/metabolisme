  depends_on: [S-11]

- id: O-22
  type: observation
  title: >
    Contrat de concession ASF consolidé au 15 janvier 2024 : art. 2.2, les
    biens de retour « appartiennent à l'autorité concédante dès leur
    achèvement, acquisition ou mise à disposition » et leur retour est « en
    tout état de cause, gratuit » ; art. 32, en cas de création d'un impôt
    « spécifique aux sociétés concessionnaires d'autoroutes », les parties
    « arrêtent […] les mesures de compensation, notamment tarifaires » ;
    art. 36.1, fin le 30 avril 2036 ; art. 36.2, fin anticipée sans
    indemnité si le cumul des recettes actualisées à 8 % depuis 2006 atteint
    40,6 Md€, au plus tôt le 31 décembre 2033 ; art. 37.1, à l'expiration
    « l'Etat […] entrera immédiatement et […] gratuitement en possession
    des Biens de Retour. A dater du même jour, tous les produits de la
    concession lui reviendront » ; art. 38, rachat pour motif d'intérêt
    général contre la juste valeur des flux actualisés après impôts.
  depends_on: [S-12, D-04, D-07, D-08]

- id: O-23
  type: observation
  title: >
    Mission IGF-CGEDD (février 2021, publié en mars 2023), scénario de
    référence à fin 2020 : TRI projet / TRI actionnaire — ASF-Escota 7,80 %
    / 11,77 %, APRR-Area 8,69 % / 12,49 %, Sanef-SAPN 8,03 % / 7,70 %,
    contre un coût des fonds propres de 7,67 % retenu à la privatisation ;
    « la baisse de l'IS a quant à elle augmenté le TRI projet de plus de 20
    pb ». Réalignement sur 7,67 % : fin anticipée d'ASF-Escota au 30 avril
    2026 et d'APRR-Area au 30 septembre 2026, ou baisse des péages de 58 %
    et 59 % dès 2022, ou prélèvement de 63 % et 64 % de l'EBE (32,9 et 22,5
    Md€ constants) ; « seul le premier ajustement paraît légalement
    envisageable au titre de la jurisprudence Olivet » (Conseil d'État,
    avis n° 399132 du 6 février 2020), « avec néanmoins le risque que le
    juge considère la rentabilité des concessions comme raisonnable ». Si
    les dividendes avaient été anticipés, ASF-Escota aurait valu 15,1 au
    lieu de 10,4 Md€ et APRR-Area 10,1 au lieu de 6,7 Md€.
  depends_on: [S-06, D-03, D-07]

- id: O-24
  type: observation
  title: >
    Sénat, rapport d'information n° 65 (octobre 2024), rapporteur Hervé
    Maurey : « des concessions historiques plus rentables qu'anticipé »,
    surrentabilité qui « s'explique essentiellement par les gains de
    refinancement de leur dette » ; « une possibilité de résiliation
    anticipée contractuelle dont le coût pour l'État pourrait représenter de
    40 à 50 milliards d'euros » ; « un avis du Conseil d'État du 8 juin
    2023 souligne les risques juridiques encourus par l'État s'il résiliait
    de façon anticipée » ; pour l'après : « la gratuité : un piège
    démagogique à éviter », « la gestion publique en régie : une solution
    inadaptée » qui « élimine le sujet de la potentielle captation d'une
    rente par des sociétés privées mais fait peser parallèlement davantage
    de risques financiers sur l'État », des contrats futurs de 15 à 20 ans
    sans prolongation, et le mécanisme de « soulte » préconisé par l'ART
    (« une indemnité monétaire définie dès la signature du contrat comme la
    part des coûts contractualisés que les péages perçus durant le contrat
    ne permettent a priori pas de couvrir »).
  depends_on: [S-07, D-07]

- id: O-25
  type: observation
  title: >
    Autorité de la concurrence, avis n° 14-A-13 (2014), sur comptes
    consolidés IFRS 2004-2013 : en 2013, EBE / chiffre d'affaires entre 65 %
    et 72 %, résultat d'exploitation / CA entre 44 % et 51 %, résultat net /
    CA entre 20 % et 24 % pour les SCA historiques ; pour les groupes Vinci
    et Eiffage, concessions incluses, 14,3 % / 14,7 %, 9,3 % / 8,8 % et
    5,1 % / 2,3 % ; les SCA offrent « une activité largement indifférente
    aux cycles économiques, des marges élevées mais nécessitant des capitaux
    considérables ».
  depends_on: [S-13]

- id: O-26
  type: observation
  title: >
    ART, EGC3, chapitre 3 sections 3-4 : d'ici 2036, les sept SCA
    « devraient générer des flux de trésorerie opérationnels […] de près
    de 83 milliards d'euros courants soit, actualisés en 2024, 53 milliards
    d'euros », face à 21 Md€ courants de remboursements de dette et 19 Md€
    d'investissements dont 8,0 Md€ de fin de contrat ; la remise en bon état
    pourrait coûter jusqu'à 1,2 Md€ supplémentaires (1,6 Md€ courants),
    l'entretien en régime de croisière étant « de l'ordre de 1 milliard
    d'euros par an » ; la TEITLD représente 500 M€ en 2024 et 6,3 Md€
    cumulés (− 0,17 point de TRI) ; entre 2016 et 2024 le concédant « a
    contractualisé des investissements à hauteur de 1,7 milliard d'euros de
    recettes de péage » ; « il est logique d'observer que les SCA disposent
    de marges de manœuvre, à l'approche de la fin des contrats », les
    dividendes étant « plus importants en fin de contrat qu'en début ».
  depends_on: [S-02, D-06]

- id: O-27
  type: observation
  title: >
    Concédant (DGITM) : le patrimoine autoroutier concédé est « estimé à
    près de 150 milliards d'euros » et « reviendra à l'État » au terme des
    contrats (rapport d'activité 2020, p. 18) ; en 2024, les usagers ont
    payé 15,4 Md€ TTC de péages, 10,3 Md€ pour les véhicules légers et 5,1
    Md€ pour les poids lourds, dont 3,5 Md€ d'investissement et d'entretien
    (rapport 2024, p. 10) ; en 2019, les sociétés concessionnaires
    réalisaient 10 365 M€ de chiffre d'affaires, 7 502 M€ d'EBITDA et 3 665
    M€ de résultat net (annexe 10, d'après l'ART).
  depends_on: [S-14, S-17]

- id: O-28
  type: observation
  title: >
    ART, EGC 1re édition (2020), p. 101-102 : pour le TRI, l'Autorité
    valorise l'actif à la troncature (2002) par un actif moderne équivalent
    ; « les sociétés concessionnaires historiques n'archivaient pas de
    données financières depuis l'origine de la concession et […] les coûts
    d'acquisition et de construction des actifs historiques n'étaient pas
    connus année par année, seule la valeur brute globale étant conservée »
    ; la valeur brute est ventilée par année de mise en service et indexée
    sur le TP01 majoré de 1 % ; p. 138 : dette nette / EBITDA des sociétés
    historiques privées de 4,9 en 2005 à 3,9 en 2018, EBITDA / frais
    financiers de 3,0 à 10,0.
  depends_on: [S-15, D-03]

# ------------------------------------------------------ transformations

- id: T-01
  type: transformation
  title: >
    Transcription manuelle, ligne à ligne, des comptes 2023 des trois
    groupes figés (ASF-Escota, Cofiroute, APRR-Area), des agrégats du
    secteur (ART 2023-2024), des chiffres d'affaires 2024 par société
    (ASFA) et des résultats par pôle de VINCI (2023), dans
    data/transcribed/comptes-2023.csv : chaque valeur porte la source, la
    page du PDF et un libellé ; les lignes sont parsées au bord (pydantic,
    TranscribedRow) et le bilan de chaque groupe doit se reboucler (brut −
    amortissements − subventions nettes + encours = valeur nette publiée, à
    1 M€ près) avant toute mesure. Les sources étant des PDF, la
    transcription est la seule étape non automatisée de la chaîne ; elle
    est vérifiable page par page. Décision DEC-03.
  depends_on: [O-17, O-18, O-19, O-20, O-21, O-16]
