# ------------------------------------------------------------- résultats

- id: R-01
  type: result
  title: >
    De combien : en 2023, les usagers des sept concessions historiques
    privées ont payé entre 5,1 et 6,1 milliards d'euros de plus que le coût
    d'une fourniture efficace au sens de D-15 (base nette au coût
    historique, taux de 8,8 % à 5,0 %), soit 46 à 54 % des recettes ; sur
    la base la plus large que la définition admette (coût historique brut,
    jamais amorti), encore 1,8 à 3,6 milliards (trois groupes) ; par la
    méthode du régulateur, qui valorise l'actif à son coût de remplacement
    en 2002, 0,8 milliard par an au taux que l'ART juge cohérent (7 %) et
    2,6 milliards au taux de référence commun des études (5 %). Le
    surprofit est positif à toutes les bornes, sur toutes les bases, sauf
    par la méthode du TRI au-dessus de 8 %.
  depends_on: [M-01, M-02, M-03, I-02]
  limitations: [L-01, L-04, L-08]

- id: R-02
  type: result
  title: >
    À qui : sur les 12,3 Md€ de chiffre d'affaires 2023 du secteur, l'État
    a reçu environ 1,2 Md€ de prélèvements spécifiques (TAT, redevance
    domaniale) et 1,5 Md€ d'IS (2,7 Md€, 22 %), auxquels s'ajoutent en 2024
    la TEITLD (0,5 Md€) et, hors périmètre des SCA, 2 Md€ de TVA sur les
    péages ; les actionnaires ont reçu 4,1 Md€ de dividendes (4,4 en 2024,
    dont 96 % pour les quatre groupes historiques) ; les créanciers 0,8
    Md€ d'intérêts ; 1,4 Md€ ont été investis. Sur 2006-2019, les
    dividendes des trois groupes privatisés (27,6 Md€) ont dépassé de 5,2
    Md€ leur prix d'acquisition (22,4 Md€) ; 40 Md€ de dividendes sont
    attendus après 2022. La rente se partage donc entre l'État (par
    l'impôt) et les actionnaires, à raison d'environ 60 % pour les seconds et
    40 % pour le premier ; l'usager n'en reçoit rien en prix.
  depends_on: [M-02, O-09, O-14, O-15, O-17]
  limitations: [L-05, L-08]

- id: R-03
  type: result
  title: >
    Coût pour la collectivité (estimation, jamais un constat) : la rente
    privatisée (R-01) ; les hausses de péage contractualisées en
    compensation d'investissements (1,7 Md€ de recettes 2016-2024, dont 500
    M€ « discutables » selon l'ART) ; les effets d'aubaine du modèle
    (baisse de l'IS + 7,9 Md€ et inflation + 5,4 Md€ cumulés selon l'ART) ;
    le risque de restitution d'un réseau dégradé (effort de remise en bon
    état estimé entre 1,2 et 1,6 Md€, jusqu'à 4,7 Md€ d'investissements de
    seconde phase contestés) ; et le coût d'opportunité d'un rachat
    anticipé (40 à 50 Md€), qui interdit en pratique toute reprise de la
    rente avant l'échéance. Les coûts externalisés (qualité, entretien
    différé) ne sont pas chiffrés ici (L-09).
  depends_on: [R-01, O-26, O-10, O-24, O-03]
  limitations: [L-09]

- id: R-04
  type: result
  title: >
    Quatre configurations comparées à l'échéance 2031-2036 (C-05 du
    cadrage) : (1) statu quo prolongé — nouvelle concession longue à
    recette privée : rente reconduite, l'État en capte 22 à 36 % par
    l'impôt, transition nulle, risque de trafic transféré ; (2) privé
    régulé — concessions courtes (15-20 ans) avec base d'actifs régulés au
    coût historique et taux reconnu : le surprofit tombe à zéro au taux
    reconnu par construction, la destination dépend du taux (5 % : prix au
    coût ; 7 % : 0,8 Md€ laissés), transition = régulateur outillé,
    soulte pour les gros investissements ; (3) collectivisation — retour
    gratuit des biens (acquis), recette publique affectée (AFIT France) et
    exploitation déléguée au forfait ou en régie : les 5 à 6 Md€ annuels
    reviennent à la collectivité, l'État porte le risque de trafic (dette
    publique : 30 Md€ de dette des SCA à refinancer ou laisser
    s'éteindre), continuité par contrats d'exploitation ; (4) privé
    intégral — cession de l'infrastructure : rente capitalisée dans le prix
    de vente (précédent 2006 : 14,8 Md€ pour des dividendes de 40 Md€ après
    2022), borne. Aucune configuration n'est retenue par le graphe ; le
    choix dépend de V-01.
  depends_on: [R-01, R-02, R-03, O-08, O-22, O-24, O-10, O-17, V-01]
  limitations: [L-08, L-09]

# ------------------------------------------------------- interprétations

- id: I-01
  type: interpretation
  title: >
    Attribution : le surprofit mesuré est une rente de position au sens du
    cadrage (monopoles:D-03), pas une prime de risque ni une avance
    technique. Les trois conditions de monopoles:I-03 sont remplies : (i)
    positif aux deux bornes de H-01 sur les deux bases (M-01) ; (ii) le
    témoin substituable du même groupe, mesuré de la même façon, n'en
    montre pas (4 à 6 % contre plus de 45 %, M-04) ; (iii) les causes
    concurrentes sont contrôlées — la prime de risque est déjà dans la borne
    haute 8,8 % (TRI projet avec risque de trafic), la restriction
    réglementaire est la concession elle-même (le prix est administré par la
    loi tarifaire, pas par le marché), l'avance technique n'existe pas
    (l'infrastructure est la même sous tout exploitant). Ce qui la
    renverserait : un témoin substituable montrant plus de 25 % de
    surprofit rapporté au chiffre d'affaires, ou une base d'actifs au coût
    historique deux à trois fois supérieure à celle des comptes.
  depends_on: [M-01, M-04, H-10, D-01]
  limitations: [L-06, L-07]

- id: I-02
  type: interpretation
  title: >
    Pourquoi deux mesures : la forme comptable de D-15 (5 à 6 Md€ par an)
    et la forme du régulateur (0,8 à 2,6 Md€) diffèrent par la BASE, pas
    par les flux. D-15 rémunère le capital sur le coût historique net des
    subventions et des amortissements déjà payés par les péages ; l'ART
    tronque en 2002 et rémunère un actif moderne équivalent — le coût de
    reconstruire le réseau en 2002, indexé sur le TP01 majoré de 1 % (O-28)
    — c'est-à-dire qu'elle recapitalise en 2002 une infrastructure que
    quarante ans de péages avaient déjà largement payée, exactement ce que
    le cadrage refuse pour le prix d'acquisition. Les deux mesures sont
    cohérentes entre elles : la base brute au coût historique (M-01,
    variante gross) donne 1,8 à 3,6 Md€, entre les deux. Ce qui la
    renverserait : une reconstitution des coûts historiques année par année
    montrant que la valeur brute des comptes sous-estime le coût de
    construction d'un facteur deux ou plus.
  depends_on: [M-01, M-03, O-28, D-02]
  limitations: [L-07, L-08]

- id: I-03
  type: interpretation
  title: >
    Le statu quo n'est pas un point fixe : entre décembre 2031 et septembre
    2036, les sept contrats expirent, les biens de retour — déjà propriété
    de l'État — reviennent gratuitement et « tous les produits de la
    concession lui reviendront » (O-22). Sans décision, l'État encaisse
    la recette ; la rente n'est reconduite que si une nouvelle concession
    longue à recette privée est signée. Avant l'échéance, les deux voies de
    reprise coûtent la rente d'avance (rachat, 40-50 Md€) ou sont
    juridiquement incertaines (résiliation « Olivet », O-23) ; la seule
    clause contractuelle d'encadrement (D-08) est calée sur un taux de 8 %.
    Ce qui la renverserait : une prolongation des contrats par la loi, ou
    une jurisprudence rendant la résiliation sans indemnité praticable.
  depends_on: [O-08, O-22, O-10, O-23, O-24, D-04, D-07, D-08]

- id: I-04
  type: interpretation
  title: >
    Le prix de 2006 a capitalisé une partie seulement de la rente : 14,8
    Md€ pour l'État, contre 27,6 Md€ de dividendes déjà versés aux trois
    acquéreurs sur 2006-2019 et 40 Md€ attendus après 2022 (O-09) ; l'IGF
    estime que le prix « juste » aurait été supérieur de 45 à 52 % pour
    ASF-Escota et APRR-Area (O-23), et le Sénat de 2024 attribue
    l'essentiel de l'écart aux gains de refinancement de la dette (O-24).
    C'est l'illustration de monopoles:H-02 : une cession déplace la rente
    sans la supprimer, et la partage au prix d'un jour. Ce qui la
    renverserait : une valeur actualisée des dividendes 2006-2036 au coût
    des fonds propres de 2006 (7,67 %) inférieure au prix payé.
  depends_on: [O-09, O-10, O-23, O-24]
  limitations: [L-10]

# ------------------------------------------------------------- valeurs

- id: V-01
  type: value
  title: >
    Reprise des valeurs du cadrage (monopoles:V-01, V-04, V-05, V-06) : une
    rente de position ne doit pas revenir à un propriétaire privé au seul
    titre de la position qu'il détient ; elle revient à la collectivité
    des usagers, par un prix au coût ou par une recette affectée, dite et
    visible, sans rupture du service. Pour les autoroutes, le cadrage
    propose d'instruire en premier la RECETTE AFFECTÉE à l'échéance avec
    exploitation au forfait (monopoles:C-05) : la demande y étant peu
    élastique et la congestion réelle, le prix au coût n'est pas la seule
    destination admissible. Ceci est une position normative, pas une
    conséquence des mesures.
  depends_on: [O-01, R-01]

# --------------------------------------------------------------- choix

- id: C-01
  type: choice
  title: >
    Le cadrage monopoles/ est traité comme une SOURCE figée (S-01, tag
    monopoles-cadrage-v1.0) : les notions communes (D-15, D-21, H-06, H-17,
    C-05, V-01, V-05) sont reprises comme définitions et hypothèses locales
    qui citent cette source et portent l'identifiant d'origine, plutôt que
    résolues par le site entre études ou recopiées sans lien (décision
    DEC-01, options écartées : résolution inter-études, recopie). Ce
    qui le renverserait : une deuxième étude sectorielle, qui justifierait
    la résolution inter-études dans le contrat du site.
  depends_on: [S-01, O-01]

- id: C-02
  type: choice
  title: >
    Périmètre et année de la mesure : les sept concessions historiques
    privées (ASF, Escota, Cofiroute, APRR, Area, Sanef, SAPN), l'exercice
    2023 (dernier exercice dont les comptes des trois groupes et la synthèse
    de l'ART sont tous disponibles), les comptes IFRS consolidés par groupe
    (ASF-Escota, APRR-Area-Aliae, Cofiroute) tels que publiés — pas les
    comptes sociaux, ni les études financières transmises au concédant ;
    Sanef-SAPN extrapolé faute de comptes figés (H-07, H-09). Les
    concessions récentes (attribuées par appel d'offres, TRI 5,9 %) ne
    sont pas mesurées : elles seraient le témoin « contractuel » de
    monopoles:H-02, à instruire (DEC-05). Décision DEC-03 (options
    écartées : comptes sociaux, agrégats seuls, extraction automatique).
    Ce qui le renverserait : des
    comptes sociaux montrant une base d'actifs au coût historique
    sensiblement différente de la base IFRS.
  depends_on: [O-02, O-17, O-18, O-19, O-20]
  limitations: [L-04, L-07]

- id: C-03
  type: choice
  title: >
    Les prélèvements SPÉCIFIQUES au secteur (taxe d'aménagement du
    territoire, redevance domaniale, contribution à l'AFITF, TEITLD) sont
    comptés comme une DESTINATION du surprofit (part de l'État), pas comme
    un coût de fourniture efficace ; les impôts généraux (CET) restent des
    coûts ; l'IS est une destination (D-15). Justification : ces
    prélèvements n'existent que parce que la position existe — ils
    prélèvent la rente, ils ne produisent pas le service — et le contrat
    lui-même les traite comme des éléments de l'équilibre à compenser par
    le péage (art. 32, O-22). Ce qui le renverserait : la démonstration
    que la TAT finance un coût du service (elle finance l'AFIT France, donc
    d'autres infrastructures). Décision DEC-04 (option écartée : les
    compter en coût, comme l'ART).
  depends_on: [O-14, O-15, O-22, D-01, D-06]
  limitations: [L-05]

- id: C-04
  type: choice
  title: >
    Deux bases et deux amortissements présentés côte à côte, sans en
    retenir un : base NETTE comptable (valeur nette du domaine concédé +
    corporelles, subventions déduites — le modèle de la CRE, D-02) et base
    BRUTE au coût historique net des subventions (borne haute : comme si
    rien n'avait été amorti) ; amortissement COMPTABLE (caducité sur la
    durée du contrat, D-05) et amortissement TECHNIQUE (coût brut sur H-06).
    La variante centrale est nette-comptable ; la variante brute-comptable
    est la plus favorable aux concessionnaires que D-15 admette. Le coût de
    remplacement (actif moderne équivalent) n'est pas une base admise par
    D-15 ; il est présenté par M-03. Ce qui le renverserait : une source
    donnant le coût historique de construction année par année (O-28 dit
    qu'elle n'existe pas chez les SCA). Décision DEC-06 (options
    écartées : une base unique ; la base de l'ART).
  depends_on: [D-01, D-02, D-05, O-13, O-28]
  limitations: [L-03, L-07]

- id: C-05
  type: choice
  title: >
    Témoin substituable : les pôles VINCI Energies et VINCI Construction —
    même groupe que VINCI Autoroutes, même année, mêmes normes comptables,
    activités où « quelqu'un peut faire aussi bien autrement » (marchés
    concurrentiels de travaux et de services) —, mesurés par la même forme
    (résultat opérationnel moins taux × capitaux engagés, rapporté au
    chiffre d'affaires). VINCI Autoroutes sur ses capitaux engagés au prix
    d'acquisition est ajouté comme contre-exemple de base. Le marché des
    autocars librement organisés (régulé par la même autorité) était le
    témoin envisagé ; ses rapports ne publient pas de résultats
    d'exploitation par opérateur (décision DEC-05, options écartées :
    autocars, concessions récentes). Ce qui le renverserait : un
    témoin de construction montrant un surprofit rapporté au chiffre
    d'affaires supérieur à 25 %.
  depends_on: [O-21, O-25, D-01]
  limitations: [L-07]

# ---------------------------------------------------------- propositions

- id: P-01
  type: proposal
  title: >
    Ce qui découle des mesures SI l'on tient V-01 : (a) ne pas reconduire à
    l'échéance une concession longue à recette privée et ne pas prolonger
    les contrats en cours — chaque année de prolongation reconduit 5 à 6
    Md€ de surprofit ; (b) ne pas racheter avant terme (la rente serait
    payée d'avance, 40 à 50 Md€) mais faire exécuter les obligations de
    fin de contrat (remise en bon état, seconde phase) ; (c) à l'échéance,
    conserver la recette (recette affectée, visible, V-01) et déléguer
    l'exploitation et l'entretien par contrats courts au forfait ou en
    régie — la concurrence POUR le réseau, pas SUR la recette (monopoles:Q4)
    — ou, si une concession est retenue, la limiter à 15-20 ans sur une
    base d'actifs régulés au coût historique et au taux reconnu, avec
    soulte ; (d) chiffrer avant 2031 ce que la recette publique finance et
    à quel prix (au coût, ou affecté), poste par poste. Ceci est une
    proposition conditionnelle à la valeur V-01, pas une conséquence des
    données. Décision DEC-07 (options écartées : ne rien proposer ;
    proposer comme conséquence des mesures).
  depends_on: [R-01, R-04, I-03, V-01, O-24]
  limitations: [L-08, L-09]

# --------------------------------------------------------------- limites

- id: L-01
  type: limit
  title: >
    Tout taux de rémunération est un jugement : celui du cadrage (5,0 %,
    régulateurs de l'énergie et des télécoms), celui de l'ART (≈ 7 %,
    reconstruit sur 1960-2022), celui négocié par l'État (5,9 %), celui du
    marché (2,28 à 5,51 %). La mesure est donnée à chacun ; elle ne dit
    pas lequel est juste. Sur la base nette, le résultat en dépend peu
    (4,2 à 5,2 Md€ entre 8,8 et 4,0 %) ; par la méthode du TRI il change
    de signe.
  depends_on: [H-01, H-02, H-03, H-04]

- id: L-02
  type: limit
  title: >
    L'équivalence « un point de TRI ≈ 8 % de chiffre d'affaires » de l'ART
    est une linéarisation au voisinage de 7-8 % sur 2003-2036 ; l'appliquer
    à 2,28 % ou à 4 % extrapole hors de son domaine. M-03 est un ordre de
    grandeur, pas une mesure.
  depends_on: [H-05, M-03]

- id: L-03
  type: limit
  title: >
    La durée de vie technique de l'infrastructure (H-06, 60 ans [40 ; 100])
    n'a pas de source figée : c'est une convention d'ingénierie. Son effet
    est borné (+ 0,3 à + 1,0 Md€ sur la variante technique, entre 40 et 100 ans) et la variante
    comptable est présentée en premier.
  depends_on: [H-06, M-01]

- id: L-04
  type: limit
  title: >
    Les comptes consolidés 2023 de Sanef-SAPN (groupe Abertis) n'ont pas pu
    être figés : le site groupe.sanef.com rejette les téléchargements non
    interactifs (403), y compris par navigateur piloté (trois méthodes
    tentées le 2026-09-18). Sanef-SAPN (17,4 % des recettes des sept) est
    extrapolé (H-07, H-09) ; l'ART et le Sénat le donnent moins rentable
    que la moyenne, donc l'extrapolation est plutôt une borne haute. À
    figer par un téléchargement manuel.
  depends_on: [H-07, H-09, C-02]

- id: L-05
  type: limit
  title: >
    Les comptes d'ASF-Escota et de Cofiroute ne détaillent pas « impôts et
    taxes » ; la part des prélèvements spécifiques y est celle d'APRR-Area
    (H-08, 85 %), dont le périmètre inclut par ailleurs la petite concession
    récente ALIAE. L'effet de H-08 sur le surprofit total est de ± 70 M€
    entre ses bornes. Les prélèvements spécifiques du secteur sont connus
    en agrégat (1,2 Md€, O-15), pas par société.
  depends_on: [H-08, C-03, T-01]

- id: L-06
  type: limit
  title: >
    La non-duplicabilité de l'infrastructure (H-10) est établie par le
    droit (biens de retour propriété de l'État, D-04) et par l'élasticité
    faible de la demande (O-15), pas par un coût de duplication chiffré ;
    l'alternative gratuite (réseau routier national) existe mais sa qualité
    n'est pas comparée ici. Même limite que monopoles:L-09.
  depends_on: [H-10, D-04]

- id: L-07
  type: limit
  title: >
    Les bases d'actifs sont lues dans des comptes IFRS (IFRIC 12) : le
    « droit à percevoir les péages » y correspond « à la juste valeur de
    l'ouvrage concédé », que les notes assimilent aux coûts de construction
    (ASF : « coûts des infrastructures » ; Cofiroute : « coût de revient
    historique » en comptes sociaux). Les comptes sociaux des sept sociétés
    n'ont pas été figés ; l'Autorité de la concurrence notait en 2014 que
    « la comparaison avec les comptes sociaux ne montre […] pas de
    différences significatives » (O-25). VINCI Autoroutes (M-04) est un
    périmètre plus large qu'ASF-Escota + Cofiroute (Arcour, services).
  depends_on: [T-01, O-18, O-19, O-20, O-25, C-02]

- id: L-08
  type: limit
  title: >
    La mesure porte sur UN exercice (2023, année de trafic et de tarifs
    élevés) et sur des concessions en fin de vie, quand la base est
    presque amortie et les dividendes au plus haut (O-26) ; elle ne dit
    pas ce qu'ont payé les usagers des années 1970-2000, ni ce que vaut la
    rente sur toute la durée du contrat — c'est l'objet de M-03 et de I-02.
    Une série 2006-2024 sur les mêmes comptes est la suite naturelle.
  depends_on: [M-01, M-02, C-02]

- id: L-09
  type: limit
  title: >
    Les coûts externalisés (entretien différé, état de restitution, temps
    perdu en congestion, report de trafic sur le réseau gratuit) ne sont
    pas chiffrés : R-03 les nomme et cite les ordres de grandeur de l'ART
    et du Sénat sans les additionner à la rente.
  depends_on: [R-03]

- id: L-10
  type: limit
  title: >
    Observations de second rang : l'expertise de Frédéric Fortin et
    l'étude EDHECinfra sont connues par le rapport du Sénat qui les cite
    (S-05), non par leurs fichiers d'origine ; le modèle Fortin n'est pas
    publié. Résout la limite monopoles:L-12 (FIPECO) sans la faire
    disparaître entièrement.
  depends_on: [O-09, O-12]
