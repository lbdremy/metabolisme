# Graphe de preuves (méthode Métabolisme, INTRO §10) — les statuts hors
# registres : O observations, T transformations, M mesures, R résultats,
# I interprétations, V valeurs, C choix, P propositions, L limites.
# Chaque nœud référence ses dépendances par identifiant ; contrôle par
# `uv run autoroutes validate` (références résolues, empreintes) et au build
# du site. Étude sectorielle « autoroutes », session 1 (2026-09-18), menée en
# autonomie : les choix méthodologiques sont journalisés dans
# evidence/decisions-2026-09-18.md (DEC-nn). Les identifiants du cadrage
# sont cités « monopoles:X-nn » et ne se résolvent pas ici (S-01).

# ---------------------------------------------------------- observations

- id: O-01
  type: observation
  title: >
    Le cadrage monopoles/ (tag monopoles-cadrage-v1.0) fixe le taux de
    référence commun H-06 à 5,0 % nominal avant impôts, plage [4,0 ; 8,8]
    (centre : CRE et ARCEP ; borne haute : haut de l'intervalle de confiance
    du TRI projet des concessions autoroutières selon l'ART), la rente
    mesurable D-15 (surprofit sur base d'actifs au coût historique net des
    subventions, avant impôts, avec témoin), et pour les autoroutes
    l'hypothèse de classement H-17 (infrastructure non duplicable,
    concessions privées à échéance 2031-2036) et la configuration à
    instruire en premier (C-05 : « à l'échéance : recette affectée,
    exploitation au forfait ; statu quo = retour à l'État par défaut »).
  depends_on: [S-01]

- id: O-02
  type: observation
  title: >
    ART, Économie des concessions autoroutières, 3e édition (novembre 2024),
    figure 3.5 : TRI projet à terminaison des sept concessions historiques
    privées, année 2023, scénario de référence — SAPN 5,7 %, APRR 7,7 %, ASF
    7,7 %, Sanef 7,7 %, Escota 7,8 %, ensemble 7,9 %, Area 9,1 %, Cofiroute
    9,2 % ; tableau 3.2 : TRI constaté à date fin 2023 de 4,8 % pour
    l'ensemble (1,6 % SAPN à 6,7 % Cofiroute). La synthèse des comptes 2024
    confirme 7,9 % pour les historiques privées, 5,9 % pour les récentes,
    2,0 % pour les publiques.
  depends_on: [S-02, S-04, D-03]

- id: O-03
  type: observation
  title: >
    ART, EGC3, p. 95-96 : « D'après les meilleures estimations de l'ART, la
    rémunération des SCA est légèrement supérieure au coût du capital. Sur
    la durée qui s'étend de l'origine des concessions autoroutières
    historiques à nos jours, et pour un investissement dans un projet
    comparable à une concession autoroutière, le coût du capital est en
    effet de l'ordre de 7 %, soit 0,7 point de pourcentage de moins que le
    TRI projet des concessions. » ; « compte tenu des incertitudes sur la
    mesure du TRI, un écart de moins de 1 point de pourcentage n'est pas
    significatif d'un point de vue statistique » ; flux actualisés « avec
    un taux de 7,8 % » (tableaux 3.4, 3.5, 3.7).
  depends_on: [S-02, D-09]

- id: O-04
  type: observation
  title: >
    ART, EGC3, p. 95 : « à titre d'illustration, 0,7 point de pourcentage
    de TRI est à peu équivalent à un chiffre d'affaires supérieur de 5,5 %
    par an sur la période 2003-2036 soit, en moyenne, 500 millions d'euros
    courants de revenus supplémentaires par an. »
  depends_on: [S-02, D-03]

- id: O-05
  type: observation
  title: >
    ART, Focus rentabilité (juillet 2023), p. 17-18 : « Pour estimer le coût
    du capital sur la période 1960-2002, il faut tenir compte du contexte de
    marché » ; méthode par le coût de la dette après impôts, 3,7 % en
    moyenne entre 1960 et 2022, majoré de l'écart observé de trois à quatre
    points : « le coût du capital peut ainsi être estimé à environ 7 % »,
    estimation « limitée à de nombreux égards ». Conclusion : « Le TRI,
    estimé à 8 %, se compare à un coût du capital de 7 %, ce qui permet de
    conclure même en tenant compte de l'incertitude. »
  depends_on: [S-03, D-09]

- id: O-06
  type: observation
  title: >
    ART, Focus rentabilité (2023), p. 17 : « sur la période 2000-2010, le
    coût du capital des concessions historiques a oscillé entre 5,4 % et
    7,0 %, l'essentiel des valeurs se situant entre 6,0 % et 6,5 %. Les
    valeurs estimées par l'ART depuis sa prise de compétence en 2016,
    sensiblement plus faibles, reflètent le contexte historiquement bas des
    taux d'emprunt » (figure 10 : estimations hautes de l'ART entre 4 et
    6 % de 2017 à 2022).
  depends_on: [S-03, D-09]

- id: O-07
  type: observation
  title: >
    ART, Focus rentabilité (2023), p. 18 : « une hausse d'un point de
    pourcentage du TRI est équivalente à un surcroît de chiffre d'affaires
    de 8 % par an sur la période 2003-2036, soit, en moyenne, 740 millions
    d'euros courants de revenus supplémentaires par an. Actualisés en 2022,
    ces revenus supplémentaires représentent un montant de l'ordre de 40
    milliards d'euros. »
  depends_on: [S-03, D-03]

- id: O-08
  type: observation
  title: >
    ART, EGC3, figure 1.2 (p. 19) : échéances des contrats des sept
    sociétés concessionnaires historiques privées — Sanef 31 décembre 2031,
    Escota 29 février 2032, SAPN 31 août 2033, Cofiroute (réseau
    interurbain) 30 juin 2034, APRR 30 novembre 2035, ASF 30 avril 2036,
    Area 30 septembre 2036. Les contrats prévoient (art. 37) que le
    concédant établit sept ans avant l'expiration le programme d'entretien
    et de renouvellement des cinq dernières années, exécuté aux frais du
    concessionnaire et garanti (art. 33).
  depends_on: [S-02, S-12]

- id: O-09
  type: observation
  title: >
    Sénat, commission d'enquête (rapport n° 709, 2020), expertise de
    Frédéric Fortin sur les comptes consolidés 2006-2019 : ASF-Escota —
    chiffre d'affaires de 2,6 à 4 Md€, 8 Md€ d'investissements, 6,5 Md€
    d'IS, 13,8 Md€ de dividendes pour 10,4 Md€ décaissés par Vinci
    (2002-2006) ; APRR-Area — 9 Md€ de dividendes pour 6,7 Md€ décaissés
    par Eiffarie ; Sanef-SAPN — 4,8 Md€ de dividendes pour 5,3 Md€
    décaissés par Abertis ; Cofiroute — 5,8 Md€ de dividendes. TRI
    actionnaire prévisionnel 2006 / réalisé 2002-2019 / à terme : ASF-Escota
    7,13 % / 4,93 % / 10,93 % ; APRR-Area 9,2 % / 4,28 % / 11,25 % ;
    Sanef-SAPN 8 % / − 1,38 % / 7,21 %. « Au-delà de 2022, les dividendes
    versés atteindraient environ 40 milliards d'euros, dont 32 milliards
    pour Vinci et Eiffage. »
  depends_on: [S-05, D-03]
  limitations: [L-10]

- id: O-10
  type: observation
  title: >
    Sénat, rapport n° 709 (2020) : la privatisation de 2006 « a rapporté
    14,8 milliards d'euros à l'État qui s'est trouvé également déchargé des
    16,8 milliards d'euros de dette des SCA » ; « le rachat aurait un coût
    évalué par le ministère de l'économie et des finances entre 45 et 50
    milliards d'euros. Il est donc raisonnable d'aller au terme des
    concessions » ; « En l'état de leur rédaction, les clauses
    d'encadrement de la rentabilité des concessions ne sont pas
    opérantes. »
  depends_on: [S-05, D-07, D-08]

- id: O-11
  type: observation
  title: >
    Sénat, rapport n° 709 (2020) : lors du plan d'investissement
    autoroutier (2017), « un TRI finalement négocié à 6,5 % » puis, grâce
    aux avis de l'ART, « diminution du taux de rémunération du capital
    investi, qui est passé de 6,5 % à 5,9 % lors des nouvelles négociations
    entre la DGITM et les SCA » (reprise de monopoles:O-06).
  depends_on: [S-05, D-09]

- id: O-12
  type: observation
  title: >
    Sénat, rapport n° 709 (2020), citant l'étude EDHECinfra (Amenc et
    Blanc-Brude) : CMPC des concessions autoroutières en France de 5,51 %
    (2005-2010), 4,26 % (2010-2015) et 2,28 % (2015-2020) ; le CMPC de 5,9 %
    retenu en 2017 « repose sur un coût implicite des capitaux propres de
    l'ordre de 24 % » ; « À travaux, trafic et coûts d'exploitation
    constants, une baisse de 1 % du CMPC appliquée à l'ensemble des revenus
    permettrait une réduction moyenne des péages de plus de 15 %. »
  depends_on: [S-05, D-09]
  limitations: [L-10]

- id: O-13
  type: observation
  title: >
    Cofiroute, comptes annuels 2023 (règles et méthodes) : les
    immobilisations non renouvelables — « l'infrastructure du réseau et
    [les] ouvrages d'art » — ont une « durée de vie supérieure à la durée
    de la concession » ; elles sont inscrites « à leur coût de revient
    historique » et amorties par caducité « entre la date de leur mise en
    service et la fin de la concession, sur la base du coût net des
    subventions reçues » — « et non [pour] constater une dépréciation
    technique des biens ».
  depends_on: [S-09, D-05]

- id: O-14
  type: observation
  title: >
    APRR (comptes consolidés 2024, note 18), impôts et taxes 2023 / 2024 :
    taxe d'aménagement du territoire 190,7 / 196,7 M€ ; taxe sur
    l'exploitation des infrastructures de transport de longue distance 0 /
    123,3 M€ ; CET 43,7 / 41,3 M€ ; redevance domaniale 100,0 / 106,0 M€ ;
    contribution à l'AFITF 18,3 / 18,7 M€ ; total 362,3 / 495,6 M€, pour un
    chiffre d'affaires d'exploitation de 3 018,7 / 3 152,5 M€. Les
    prélèvements spécifiques (TAT + redevance + AFITF) représentent 85,3 %
    des impôts et taxes en 2023 et 10,2 % du chiffre d'affaires.
  depends_on: [S-10, D-06]

- id: O-15
  type: observation
  title: >
    Sénat, rapport d'information n° 65 (octobre 2024) : « À travers la
    fiscalité, l'État prélève chaque année environ 36 % du chiffre
    d'affaires réalisé par les autoroutes » — 1,2 Md€ de fiscalité
    spécifique (TAT : 751 M€ prévus en 2024 ; redevance domaniale ;
    contribution volontaire de 60 M€ par an à l'AFIT France, refusée par les
    SCA depuis 2021), environ 3,5 Md€ de fiscalité générale (IS ≈ 1 Md€,
    TVA collectée ≈ 2 Md€), TEITLD ≈ 450 M€ à compter de 2024 ; citant Yves
    Crozet : « La privatisation a incité les acteurs, le concédant autant
    que les concessionnaires à profiter de la faible élasticité-prix de la
    demande pour accroître le chiffre d'affaires par kilomètre de réseau »
    (+ 150 % de chiffre d'affaires par 100 km de réseau depuis 1991).
  depends_on: [S-07, D-06]

