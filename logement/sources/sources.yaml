  checksum: sha256:9c42e7ed589ecd15457a35537323406c2a51cf9d9ddd66c15c858c472986efc9
  notes: >
    Données des figures de la publication (fichier if359.xlsx, téléchargé depuis
    https://www.insee.fr/fr/statistiques/fichier/8640662/if359.xlsx).
    Source statistique sous-jacente : Estimations annuelles du parc de logements
    (EAPL), synthèse Insee-SDES (taxe d'habitation, enquêtes annuelles de
    recensement, RIL, enquêtes Logement). Séries nationales agrégées :
    parc par catégorie (Figure 1-3), habitat individuel (Figure 4), statut
    d'occupation des résidences principales (Figure 5), répartition par taille
    d'unité urbaine (Figure 6, Tableau complémentaire). La catégorie
    « logement vacant » ne signifie pas que le logement est mobilisable :
    elle agrège vacance frictionnelle et vacance durable.

