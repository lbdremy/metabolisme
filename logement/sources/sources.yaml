    hors extrait. BIAIS D'ÉCHANTILLON MAJEUR à rappeler à chaque usage :
    les DPE sont établis à la vente/location/rénovation — l'échantillon
    n'est PAS le parc (l'ONRE estime 13,9 % de F+G dans le parc au
