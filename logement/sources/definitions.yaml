# Registre des définitions (D-xx) — méthode Métabolisme, INTRO §8.
# Chaque définition est citée VERBATIM depuis sa page source (S-04 : collection
# des définitions INSEE), avec l'URL de la page, sa date de « dernière mise à
# jour » et les limites connues. La citation datée fige la version utilisée.
# Schéma typé : src/logement/models.py (DefinitionRecord) ; contrôle :
# `uv run logement validate`.
#
# Sources des définitions : S-04 (INSEE, métadonnées statistiques),
# S-05 (LOVAC/Cerema) et S-08 (Légifrance, définitions à valeur juridique).

- id: D-01
  term: logement
  source: S-04
  url: https://www.insee.fr/fr/metadonnees/definition/c1702
  last_updated: 2025-12-22
  definition: >
    Un logement, ou logement ordinaire, est un local utilisé pour
    l'habitation : séparé, c'est-à-dire complètement fermé par des murs et
    cloisons, sans communication avec un autre local sauf avec les parties
    communes de l'immeuble (couloir, escalier, etc.) ; indépendant, c'est-à-dire
    ayant une entrée avec accès direct sur l'extérieur ou sur les parties
    communes de l'immeuble.
  caveats:
    - Les logements sont répartis en quatre catégories — résidences principales,
      résidences secondaires, logements occasionnels, logements vacants
      (« catégorie de logement », page c1437).
    - Exclut les habitations mobiles et les chambres des communautés
      (maisons de retraite, foyers), sauf exceptions occupées à l'année à titre
      de résidence principale.

- id: D-02
  term: résidence principale
  source: S-04
  url: https://www.insee.fr/fr/metadonnees/definition/c1928
  last_updated: 2020-05-14
  definition: >
    Une résidence principale est un logement occupé de façon habituelle et à
    titre principal par une ou plusieurs personnes qui constituent un ménage.
  caveats:
    - Depuis 2005, une résidence principale peut comporter plusieurs ménages
      si ceux-ci ont des budgets séparés.
    - Concept central pour l'axiome normatif de l'étude (INTRO §3) — une
      résidence principale occupée n'est jamais comptée comme capacité
      disponible.

- id: D-03
  term: logement vacant
  source: S-04
  url: https://www.insee.fr/fr/metadonnees/definition/c1059
  last_updated: 2021-01-25
  definition: >
    Un logement est vacant s'il est inoccupé et : proposé à la vente, à la
    location, déjà attribué à un acheteur ou un locataire et en attente
    d'occupation, en attente de règlement de succession, conservé par un
    employeur pour un usage futur au profit d'un de ses employés, sans
    affectation précise par le propriétaire (logement vétuste, etc.).
  caveats:
    - Agrège vacance frictionnelle (rotation normale du marché) et vacance
      durable — la distinction, décisive pour l'étude, n'est pas dans la
      définition et devra être construite (seuils de durée, cf. LOVAC).
    - Ne renseigne ni l'état du bâti ni la disponibilité juridique réelle.
    - Un logement vacant n'est pas un logement mobilisable.

- id: D-04
  term: résidence secondaire
  source: S-04
  url: https://www.insee.fr/fr/metadonnees/definition/c1634
  last_updated: 2021-01-14
  definition: >
    Un logement utilisé pour des séjours de courte durée (week-ends, loisirs,
    ou vacances). Les logements meublés mis en location pour des séjours
    touristiques sont également classés en résidences secondaires.
  caveats:
    - La distinction avec les logements occasionnels étant difficile, les deux
      catégories sont souvent regroupées (c'est le cas dans S-01/S-02).
    - Inclut les meublés touristiques — pertinent pour la « capacité
      saisonnière retirée » (INTRO §7).

- id: D-05
  term: ménage (recensement de la population)
  source: S-04
  url: https://www.insee.fr/fr/metadonnees/definition/c1881
  last_updated: 2026-04-02
  definition: >
    Un ménage, au sens du recensement de la population, désigne l'ensemble des
    personnes qui partagent la même résidence principale, sans que ces
    personnes soient nécessairement unies par des liens de parenté.
  caveats:
    - Concept abandonné le 31/08/2025, remplacé par « ménage (au sens de
      ménage-logement) » (D-06) — les séries longues de S-03 reposent sur ce
      concept historique ; toute jonction de séries doit documenter la rupture.
    - Il y a égalité entre nombre de ménages et nombre de résidences
      principales — c'est ce qui permet la comparaison parc/ménages.

- id: D-06
  term: ménage (au sens de ménage-logement)
  source: S-04
  url: https://www.insee.fr/fr/metadonnees/definition/c2355
  last_updated: 2026-07-07
  definition: >
    Un ménage au sens de ménage-logement est constitué par l'ensemble des
    personnes qui habitent dans un même logement qui constitue leur résidence
    habituelle, quels que soient les liens familiaux entre ces personnes. Un
    ménage peut être constitué d'une seule personne.
  caveats:
    - Remplace D-05 depuis le 31/08/2025 ; « résidence habituelle » se
      substitue à « résidence principale » — l'effet de ce changement sur les
      séries devra être vérifié lors des prochains millésimes.

- id: D-07
  term: zone d'emploi
  source: S-04
  url: https://www.insee.fr/fr/metadonnees/definition/c1361
  last_updated: 2025-05-27
  definition: >
    Une zone d'emploi est un espace géographique à l'intérieur duquel la
    plupart des actifs résident et travaillent, et dans lequel les
    établissements peuvent trouver l'essentiel de la main d'œuvre nécessaire
    pour occuper les emplois offerts.
  caveats:
    - Découpage en vigueur (millésime 2020) fondé sur les flux
      domicile-travail du recensement 2016 — vieillissant par rapport aux
      données de parc 2025.

- id: D-08
  term: bassin de vie
  source: S-04
  url: https://www.insee.fr/fr/metadonnees/definition/c2060
  last_updated: 2016-10-12
  definition: >
    Le bassin de vie est le plus petit territoire sur lequel les habitants ont
    accès aux équipements et services les plus courants.
  caveats:
    - Définition modifiée en 2012 — l'accès à l'emploi a été retiré du
      critère ; le millésime actuel du zonage est 2022.
    - Couvre six domaines de services (services aux particuliers, commerce,
      enseignement, santé, sports-loisirs-culture, transports).

- id: D-09
  term: taux d'effort (occupation de la résidence principale)
  source: S-04
  url: https://www.insee.fr/fr/metadonnees/definition/c1809
  last_updated: 2026-07-31
  definition: >
    Le taux d'effort des ménages liés à l'occupation de leur résidence
    principale est le rapport entre la somme des dépenses liées à l'habitation
    principale et les revenus des ménages.
  caveats:
    - Deux variantes — « net » (aides au logement déduites de la dépense) et
      « brut » (sans déduction) ; toujours préciser laquelle est utilisée.
    - Revenus mesurés avant impôts ; ne couvre pas le coût du transport,
      que l'étude veut réintégrer dans un coût complet (INTRO §6.4).

- id: D-10
  term: vacance structurelle (parc privé, LOVAC)
  source: S-05
  url: https://doc-datafoncier.cerema.fr/doc/fiche_descriptive/lovac
  definition: >
    Logement privé vacant depuis plus de deux ans (variable
    pp_vacant_plus_2ans des fichiers LOVAC : « Nombre de logements vacants du
    parc privé depuis plus de deux ans » à la situation fiscale du 1er
    janvier). La vacance de longue durée, dite structurelle, est la cible du
    plan national de lutte contre les logements vacants.
  caveats:
    - Convention administrative (seuil de 2 ans) et non catégorie statistique
      INSEE — le seuil est paramétré comme hypothèse H-06 (choix C-01).
    - Vocabulaire — correspond à la « vacance durable » du cadrage
      (INTRO.md §6.2) ; la « vacance structurelle » du cadrage (difficilement
      mobilisable sans action lourde) est une notion plus exigeante que ce
      terme administratif ne recouvre pas.
    - Parc privé uniquement, source fiscale — périmètre différent de la
      vacance INSEE (D-03).
    - Structurelle ne signifie pas mobilisable — l'état du bâti et les
      blocages juridiques ne sont pas renseignés.

- id: D-11
  term: vacance frictionnelle (parc privé, LOVAC)
  source: S-05
  url: https://doc-datafoncier.cerema.fr/doc/fiche_descriptive/lovac
  definition: >
    Vacance de courte durée (deux ans ou moins dans les fichiers LOVAC,
    différence pp_vacant − pp_vacant_plus_2ans), correspondant pour
    l'essentiel à la rotation normale du marché entre deux occupations.
  caveats:
    - Une vacance courte n'est pas nécessairement frictionnelle au sens
      économique (un logement neuf invendu ou un bien en travaux y figure) —
      l'interprétation reste à qualifier territoire par territoire.
    - Un niveau plancher de vacance frictionnelle est nécessaire au
      fonctionnement du marché (INTRO §6.2) — l'objectif n'est jamais une
      vacance nulle.

- id: D-12
  term: habitat indigne
  source: S-08
  url: https://www.legifrance.gouv.fr/jorf/article_jo/JORFARTI000020439364
  last_updated: 2009-03-25
  definition: >
    Constituent un habitat indigne les locaux ou installations utilisés aux
    fins d'habitation et impropres par nature à cet usage, ainsi que les
    logements dont l'état, ou celui du bâtiment dans lequel ils sont situés,
    expose les occupants à des risques manifestes pouvant porter atteinte à
    leur sécurité physique ou à leur santé.
  caveats:
    - Définition légale (art. 84 de la loi n° 2009-323 « MOLLE » du
      25/03/2009, insérée à l'art. 4 de la loi n° 90-449 du 31/05/1990) —
      catégorie d'action publique, pas une catégorie statistique ; le
      comptage des logements indignes (PPPI, signalements) relève d'autres
      sources à enregistrer avant tout chiffre.
    - Distinct de l'habitat simplement dégradé ou non décent.

- id: D-13
  term: passoire thermique (logements classés F et G)
  source: S-08
  url: https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000043966496
  last_updated: 2021-08-25
  definition: >
    Les bâtiments ou parties de bâtiment existants à usage d'habitation sont
    classés, par niveau de performance décroissant, en fonction de leur
    niveau de performance énergétique et de leur performance en matière
    d'émissions de gaz à effet de serre — de la classe A (extrêmement
    performants) à la classe G (extrêmement peu performants) ; la classe F
    désigne les logements « très peu performants ». L'expression « passoire
    thermique » ou « passoire énergétique » désigne couramment les logements
    des classes F et G.
  caveats:
    - Base légale du classement — art. L173-1-1 du code de la construction
      et de l'habitation (créé par la loi n° 2021-1104 « Climat et
      résilience », en vigueur depuis le 25/08/2021) ; les seuils chiffrés
      des classes sont fixés par arrêté (DPE).
    - « Passoire thermique » est un usage courant, pas un terme défini par
      la loi — le périmètre retenu ici (classes F-G) suit l'usage du
      calendrier d'interdiction de location (G depuis le 01/01/2025,
      F au 01/01/2028).
    - Le DPE a été réformé en 2021 — les comptages de passoires avant/après
      la réforme ne sont pas comparables.

- id: D-14
  term: zone tendue (champ de la taxe annuelle sur les logements vacants, art. 232 CGI)
  source: S-08
  url: https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000046872468
  last_updated: 2023-01-01
  definition: >
    La taxe annuelle sur les logements vacants s'applique : 1° « dans les
    communes appartenant à une zone d'urbanisation continue de plus de
    cinquante mille habitants où il existe un déséquilibre marqué entre
    l'offre et la demande de logements » ; 2° « dans les communes ne
    respectant pas les conditions prévues au 1° du présent I où il existe
    un déséquilibre marqué entre l'offre et la demande de logements »
    (version en vigueur du 01/01/2023 au 01/01/2027). Le déséquilibre est
    caractérisé notamment par le niveau des loyers, les prix d'acquisition
    ou la demande de logements ; la liste des communes est fixée par
    décret (décret n° 2013-392 modifié, dernière révision n° 2025-1267 du
    22/12/2025, S-13).
  caveats:
    - Catégorie FISCALE et réglementaire, pas statistique — la liste
      résulte d'un décret (critères d'appréciation non publiés commune par
      commune) ; elle emporte aussi d'autres effets juridiques (préavis
      réduit, encadrement, majoration THRS).
    - Deux sous-régimes hétérogènes — le 1° vise la tension classique
      offre/demande des agglomérations, le 2° (ajouté en 2023) l'attrition
      des résidences principales en zone touristique — à distinguer dans
      toute analyse (catégories 1 et 2 du fichier S-13).
    - Zonage distinct du zonage ABC (aides au logement) et des zonages
      d'encadrement des loyers.

- id: D-15
  term: vacance de fluidité (taux de vacance nécessaire à la rotation du parc)
  source: S-14
  url: https://www.pays-de-la-loire.developpement-durable.gouv.fr/IMG/pdf/1921h20et_analyses_et_connaissance_lutte_contre_la_vacance_des_logements_v2.pdf
  last_updated: 2020-07-01
  definition: >
    « La vacance des logements est nécessaire pour assurer une rotation
    fluide des ménages dans le parc de logements. On estime le taux de
    vacance optimal autour de 6 % - 7 %. Au-dessus, on considère qu'il y a
    une surabondance de logements, et en deçà, pas assez de logements par
    rapport à la demande, soit une tension du marché immobilier » (S-14,
    p. 3). « En-deçà de 5% de taux de vacance, le marché cesse d'être
    fluide » (S-15, p. 1).
  caveats:
    - Ordre de grandeur d'usage professionnel (« on estime ») sans source
      primaire académique identifiée dans les documents figés — le seuil
      est traité comme HYPOTHÈSE paramétrée (H-08), jamais comme un fait.
    - Le seuil s'entend sur le taux de vacance TOTALE du parc entier au
      sens du recensement (D-03) — pas sur la seule vacance du parc privé
      LOVAC (L-06).

- id: D-16
  term: ancienneté d'emménagement dans le logement (recensement de la population)
  source: S-04
  url: https://www.insee.fr/fr/metadonnees/definition/c1830
  last_updated: 2026-08-06
  definition: >
    L'ancienneté d'emménagement est le nombre d'années écoulées depuis la
    date d'emménagement dans le logement. Lorsque les occupants ont
    emménagé à des dates différentes, la date d'emménagement retenue est
    celle du premier occupant arrivé : l'ancienneté mesure la stabilité
    du ménage dans le logement, pas celle de chaque individu. Pour une
    personne ayant toujours vécu dans le logement, l'année d'emménagement
    est l'année de naissance.
  caveats:
    - Dans le jeu RP2023 (S-27), la dimension harmonisée européenne
      L_STAY code l'ancienneté en 6 classes (moins de 2 ans, 2-4, 5-9,
      10-19, 20-29, 30 ans ou plus) — découpage différent de l'ANEM des
      bases communales RP2022 (S-11 - 0-2, 2-4, 5-9, 10 ans ou plus) ;
      ne jamais mélanger les deux découpages dans une même série.
    - La part d'emménagés récents est un indicateur de ROTATION du parc,
      pas de mobilité des personnes - un emménagement récent peut être
      une première installation, pas seulement un déménagement interne ;
      et les mobilités vers un autre territoire ne laissent aucune trace
      dans le parc d'origine si le logement reste vacant ou change
      d'usage.
    - Concepts harmonisés européens 2023 appliqués aux trois millésimes
      diffusés (2012, 2017, 2023) du jeu S-27 - comparaison interne au
      fichier légitime, comparaison avec les diffusions antérieures non.

- id: D-17
  term: taux de mobilité du parc locatif social (RPLS)
  source: S-28
  url: https://dreal.statistiques.developpement-durable.gouv.fr/parc_social/2022/nouvelle_aquitaine/methodo.html
  last_updated: 2022-01-01
  definition: >
    « Emménagements dans les logements proposés à la location depuis un
    an ou plus, rapportés au nombre de logements proposés à la location
    depuis un an ou plus. » Les nouvelles mises en service ne sont pas
    comptabilisées ; les rotations multiples au cours d'une même année
    ne sont pas mesurées. Le taux de vacance RPLS est le « nombre de
    logements vacants parmi les logements proposés à la location, hors
    logements vides pour raison technique, rapporté au nombre de
    logements proposés à la location » (dont vacance > 3 mois).
  caveats:
    - Champ = parc des bailleurs sociaux (hors logements-foyers,
      résidences sociales, logements vides pour travaux/démolition/
      vente) - ne se compare ni à la mobilité du parc privé ni à la
      rotation du parc total (D-16).
    - Mesure la rotation OFFERTE par le parc social - un taux bas peut
      refléter le blocage des sorties (pas d'alternative abordable dans
      le privé) autant que la stabilité choisie des locataires.
    - Le fichier S-28 publie le ratio par territoire, pas ses deux
      termes - toute agrégation supra-communale est une moyenne
      pondérée approchée (convention à déclarer), pas un recalcul.
