- id: H-12
  name: lovac_structural_existence_rate
  description: >
    Fraction du gisement structurel LOVAC (vacance > 2 ans du parc privé,
    D-10) correspondant à des logements RÉELLEMENT vacants au moment où
    la base est exploitée. Introduite le 2026-08-07 par la revue
    contradictoire : la Cour des comptes (S-22, p. 21) établit que LOVAC
    surestime la vacance (+14 % vs INSEE 2020 à périmètre comparable ;
    Cerema : +10 à +20 %) et que « les remontées de terrain permettent
    d'estimer qu'environ 25 % des logements réputés vacants dans la base
    ne le sont pas (ou plus) en réalité » (reloués, revendus, démolis,
    identifiés à tort — cas extrême documenté : Saint-Brieuc Armor, 74
    réellement vacants sur 270 contactés). Valeur centrale : 0,75 (le
    complément des ~25 % de la Cour). Plage plausible : 0,60 (remontées
    de terrain plus défavorables — le cas Saint-Brieuc, à 0,27, est
    traité comme aberrant : campagne unique, biais de ciblage) à 0,90
    (borne basse de la surestimation Cerema, ~1/1,10). PROPAGATION
    COHÉRENTE dans C-06 : le taux s'applique à la fois au gisement
    (gisement effectif = H-12 × structurelle) ET à la soustraction qui
    définit la vacance disponible (disponible = vacants recensés −
    H-12 × structurelle) — les faux vacants LOVAC ne sont pas non plus
    une offre disponible. L'effet net sur la couverture n'est donc pas
    le simple abattement du numérateur : le besoin baisse aussi ; la
    chaîne publie le calcul complet, jamais une intuition. Ne couvre PAS
    la mobilisabilité comportementale des vrais vacants (successions,
    rétention volontaire, refus de louer) : celle-ci reste une limite
    qualitative documentée (Cour : 6 700 sorties de vacance ZLV en 4
    ans, ~3 % de taux de sortie en zone tendue), non paramétrée faute de
    source donnant une fraction.
  central_value: 0.75
  plausible_range: [0.6, 0.9]
  unit: fraction
  confidence: low
  justification:
    - S-22
    - S-05
  affects:
    - R-07
    - R-09

- id: H-13
  name: transfer_tax_rate_pct
  description: >
    Taux TOTAL de droits de mutation à titre onéreux (droit
    départemental + taxe communale 1,20 % + frais d'assiette de 2,37 %
    du droit départemental) appliqué au prix d'achat d'un logement
    ancien, hors primo-accédants. Les trois niveaux existants au
    01/02/2026 (S-31) : 6,32 % du prix quand le département a voté le
    taux temporaire de 5,00 % (la grande majorité, faculté ouverte par
    la loi de finances 2025 jusqu'au 31/03/2028), 5,81 % dans les ONZE
    départements restés à 4,50 % (05, 06, 07, 16, 26, 27, 48, 60, 65,
    71, 971 — liste vérifiée ligne à ligne sur le PDF par la revue
    2026-08-09, qui a rattrapé le 65 absent de la note initiale),
    5,09 % au taux de 3,80 % (Indre ; Mayotte, hors champ DVF). Depuis
    la revue 2026-08-09 (HD-3/HD-4/HD-5), le calcul central de R-14
    est TERRITORIALISÉ (taux S-31 du département de chaque vente) et
    les trois scénarios uniformes publiés en sensibilité sont
    {5,09 ; 5,81 ; 6,32} — 5,81 % étant à la fois le droit commun
    d'avant 2025, le taux du PRIMO-ACCÉDANT (exclu de la faculté), et
    le taux de retour si la faculté s'éteint en 2028 ; 5,09 % reste le
    plancher observé. Valeur centrale : 6,32 % (le cas majoritaire) ;
    plage plausible [5,09 ; 6,32]. S'ajoutent dans le calcul de R-14
    les émoluments proportionnels du notaire (barème S-32, calculés
    exactement dans le code, TVA 20 % comprise) et la contribution de
    sécurité immobilière (0,10 %, S-37) — mais NI les débours NI les
    éventuels frais d'agence : le coût de transaction publié reste un
    PLANCHER (limite dédiée).
  central_value: 6.32
  plausible_range: [5.09, 6.32]
  unit: pct_of_price
  confidence: medium
  justification:
    - S-31
    - S-32
    - S-08
  affects:
    - R-14

