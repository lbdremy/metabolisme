    petite taille des vacants durables (S-23 : × 2,8 si < 35 m², × 3,3
    si avant 1900 — L-18), qui abaissent la valeur vénale sous la
    médiane des biens vendus ; la sensibilité est donc orientée à la
    BAISSE du coût d'acquisition, le central étant conservateur
    (majorant). Ne couvre pas les indemnités accessoires (L-27).
  central_value: 1.0
  plausible_range: [0.5, 1.0]
  unit: factor_on_median_price
  confidence: low
  justification:
