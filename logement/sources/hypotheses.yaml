# Registre des hypothèses (H-xx) — méthode Métabolisme, INTRO §9.
# Toute valeur introduite dans un modèle est un paramètre nommé : valeur
# centrale, plage plausible, unité, niveau de confiance, justification (ids
# S-xx/I-xx...), résultats affectés (R-xx). Jamais de constante enfouie dans
# une formule. Schéma typé : src/logement/models.py (HypothesisRecord).
#
# RÉSERVATION D'IDENTIFIANTS : H-01 à H-05 désignent les hypothèses
# directrices du cadrage (INTRO.md §4 : parc sorti d'usage, capacités mal
# localisées, coût, mobilités empêchées, inefficacités institutionnelles).
# Elles ne sont pas des paramètres chiffrés et ne figurent donc pas dans ce
# registre, mais leurs identifiants leur restent réservés. Les paramètres de
# modèle commencent à H-06.

- id: H-06
  name: structural_vacancy_threshold_years
  description: >
    Seuil de durée au-delà duquel une vacance est considérée comme
    structurelle (et non frictionnelle). Valeur centrale : la convention
    administrative LOVAC / plan national (plus de 2 ans), adoptée par le
    choix C-01. La plage plausible encadre la sensibilité : à 1 an on
    capture de la rotation lente de marché, à 3 ans on ne retient que les
    sorties d'usage les plus installées. Les données LOVAC open data ne
    publiant que le seuil à 2 ans, l'analyse de sensibilité complète
    nécessiterait les fichiers détaillés (ancienneté fine) — dont l'accès
    est réservé aux collectivités, services de l'État et Anah (vérifié le
    2026-08-03) : la plage plausible reste déclarée mais non testable en
    l'état.
  central_value: 2.0
  plausible_range: [1.0, 3.0]
  unit: years
  confidence: medium
  justification:
    - S-05
    - C-01
  affects:
    - R-02

- id: H-07
  name: relocation_surface_per_person_m2
  description: >
    Surface habitable par personne du logement dans lequel un ménage médian
    se reloge, utilisée pour convertir le loyer d'annonce (€/m², S-09) en
    dépense annuelle de relocation. RECENTRÉE le 2026-08-07 (revue
    contradictoire, décision de Rémy) : l'ancienne valeur centrale
    (51,2 m²/personne, surface moyenne du parc OCCUPÉ EN PLACE, S-12)
    décrivait le stock — gonflé par les 75 ans et plus (71 m²/personne)
    qui ne déménagent pas — et non un ménage qui se reloge. Nouvelle
    valeur centrale : 35 m²/personne, la surface observée par S-12
    (graphique 2, cité verbatim) pour les 30-39 ans, la tranche d'âge la
    plus mobile. Plage plausible : de 35 (borne basse identique au
    centre : aucune valeur observée plus basse dans S-12) à 51,2
    m²/personne (scénario « relocation au standard du parc en place »,
    l'ancien centre — la sensibilité publiée est donc orientée à la
    hausse). L'ancienne borne 71 (75 ans et plus) est abandonnée comme
    scénario de relocation : cette tranche déménage peu et plutôt vers
    plus petit. La conversion en unités de consommation (le revenu
    Filosofi MED_SL est en €/UC/an) passe par le ratio personnes/UC
    OBSERVÉ de chaque zone d'emploi (NUM_PER / NUM_CU, S-10), pas par un
    ménage type (décision C-04). Limites : moyenne France métropolitaine
    (les ZE ultramarines de R-06 héritent d'une surface calibrée en
    métropole) ; premiers résultats qualifiés de provisoires par S-12 ;
    la surface effectivement consommée à la relocation n'est observée
    directement par aucune source ouverte (ni S-12 ni l'INSEE Première
    n° 2090 du 21/01/2026 ne la stratifient par ancienneté
    d'emménagement, vérifié 2026-08-07) — l'appariement « tranche la
    plus mobile » reste une approximation déclarée.
  central_value: 35.0
  plausible_range: [35.0, 51.2]
  unit: m2_per_person
  confidence: low
  justification:
    - S-12
    - S-10
    - C-04
  affects:
    - R-06

- id: H-08
  name: fluidity_vacancy_threshold_pct
  description: >
    Taux de vacance totale (parc entier, recensement, D-03) en dessous
    duquel un marché local du logement est considéré comme tendu : le
    volant de logements vacants ne suffit plus à assurer la rotation
    fluide des ménages (D-15). Valeur centrale : 6 %, le bas de la bande
    « optimale » de 6-7 % citée par S-14 (« en deçà, pas assez de
    logements par rapport à la demande, soit une tension du marché
    immobilier »). Plage plausible : 5 % (seuil de blocage de S-15 —
    « en-deçà de 5% de taux de vacance, le marché cesse d'être fluide »)
    à 7 % (haut de la bande optimale, lecture exigeante). Confiance
    basse : ordre de grandeur d'usage professionnel sans source primaire
    académique — d'où l'importance de publier la sensibilité sur toute la
    plage.
  central_value: 6.0
  plausible_range: [5.0, 7.0]
  unit: pct_of_total_stock
  confidence: low
  justification:
    - S-14
    - S-15
    - D-15
  affects:
    - R-07
    - R-09
    - R-10

- id: H-09
  name: renovation_cost_maison_eur_ht_per_m2_2016
  description: >
    Coût unitaire d'une rénovation complète et performante (niveau ~BBC)
    en MAISON INDIVIDUELLE, en euros 2016 hors taxes par m² de surface
    habitable. Valeur centrale : le coût moyen après optimisation observé
    par S-17 (406 € HT/m²). Plage plausible : l'effet taille documenté
    par la même source — 496 € HT/m² pour une maison de 70 m², 348 pour
    200 m². Utilisé comme PROXY du coût de remise en usage d'un logement
    structurellement vacant : la rénovation performante recouvre une
    remise à niveau générale de l'enveloppe et des systèmes, mais ni les
    reprises structurelles lourdes ni le simple rafraîchissement — le
    sens du biais est indéterminé et documenté (L-14). À actualiser par
    le facteur IPEA (S-19) et convertir TTC (TVA 5,5 %, S-17) avant tout
    agrégat en euros courants.
  central_value: 406.0
  plausible_range: [348.0, 496.0]
  unit: eur_ht_2016_per_m2
  confidence: medium
  justification:
    - S-17
    - C-07
  affects:
    - R-09

- id: H-10
  name: renovation_cost_collectif_eur_ht_per_m2_2016
  description: >
    Coût unitaire d'une rénovation complète et performante (niveau ~BBC)
    en LOGEMENT COLLECTIF, en euros 2016 hors taxes par m² de surface
