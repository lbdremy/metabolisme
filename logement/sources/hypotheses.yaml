# Registre des hypothèses (H-xx) — méthode Métabolisme, INTRO §9.
# Toute valeur introduite dans un modèle est un paramètre nommé : valeur
# centrale, plage plausible, unité, niveau de confiance, justification (ids
# S-xx/I-xx...), résultats affectés (R-xx). Jamais de constante enfouie dans
# une formule. Schéma typé : src/logement/models.py (HypothesisRecord).
#
# RÉSERVATION D'IDENTIFIANTS : H-01 à H-05 désignent les hypothèses
# directrices du cadrage (INTRO.md §4 : parc sorti d'usage, capacités mal
# localisées, coût, mobilités empêchées, inefficacités institutionnelles).
# Elles ne sont pas des paramètres chiffrés et ne figurent donc pas dans ce
# registre, mais leurs identifiants leur restent réservés. Les paramètres de
# modèle commencent à H-06.

- id: H-06
  name: structural_vacancy_threshold_years
  description: >
    Seuil de durée au-delà duquel une vacance est considérée comme
    structurelle (et non frictionnelle). Valeur centrale : la convention
    administrative LOVAC / plan national (plus de 2 ans), adoptée par le
    choix C-01. La plage plausible encadre la sensibilité : à 1 an on
    capture de la rotation lente de marché, à 3 ans on ne retient que les
    sorties d'usage les plus installées. Les données LOVAC open data ne
    publiant que le seuil à 2 ans, l'analyse de sensibilité complète
    nécessiterait les fichiers détaillés (ancienneté fine) — dont l'accès
    est réservé aux collectivités, services de l'État et Anah (vérifié le
    2026-08-03) : la plage plausible reste déclarée mais non testable en
    l'état.
  central_value: 2.0
  plausible_range: [1.0, 3.0]
  unit: years
  confidence: medium
  justification:
    - S-05
    - C-01
  affects:
    - R-02

- id: H-07
  name: relocation_surface_per_person_m2
  description: >
    Surface habitable par personne du logement dans lequel un ménage médian
    se reloge, utilisée pour convertir le loyer d'annonce (€/m², S-09) en
    dépense annuelle de relocation. Valeur centrale : la surface moyenne
    par occupant observée en 2020 (51,2 m²/personne, enquête nationale
    Logement, S-12). Plage plausible : bornes observées du graphique 2 de
    S-12 selon l'âge de la personne de référence — 35 m²/personne pour les
    30-39 ans (la tranche qui déménage le plus : à la relocation on
    consomme plutôt moins que le parc moyen en place) à 71 m²/personne
    pour les 75 ans et plus. La conversion en unités de consommation (le
    revenu Filosofi MED_SL est en €/UC/an) passe par le ratio
    personnes/UC OBSERVÉ de chaque zone d'emploi (NUM_PER / NUM_CU,
    S-10), pas par un ménage type : le taux d'effort qui en résulte ne
    dépend d'aucun choix de composition de ménage (décision C-04).
    Limite : moyenne France métropolitaine (les ZE ultramarines de R-06
    héritent d'une surface calibrée en métropole) ; premiers résultats
    qualifiés de provisoires par S-12.
  central_value: 51.2
  plausible_range: [35.0, 71.0]
  unit: m2_per_person
  confidence: medium
  justification:
    - S-12
    - S-10
    - C-04
  affects:
    - R-06
