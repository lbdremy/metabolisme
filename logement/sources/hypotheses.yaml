- id: H-14
  name: incentive_channel_exit_rate_pct_per_year
  description: >
    Part du gisement structurel effectif d'une ZE tendue qui SORT de
    vacance chaque année sous le seul canal incitatif existant (contact
    des propriétaires, taxe sur les logements vacants — TLV/THLV, TVLH
    à partir de 2027, S-52 — dispositifs Anah), mécanisme de référence
    M-A. REFORMULÉE par la revue du 2026-09-18 (HD-3, SA-2, SE-10) : le
    constat de la Cour des comptes porte sur les logements dont les
    propriétaires ont été CONTACTÉS, pas sur le stock — « Entre 2020 et
    2024, 6 700 logements identifiés grâce à ZLV sont sortis de
    vacance, représentant 6,6 % des 102 000 logements dont les
    propriétaires ont été contactés » et, en zone tendue, « 3 % de
    logements sortis de vacance in fine » parmi les contactés (S-22,
    p. 24). Appliquer ce taux au gisement ENTIER revient à supposer que
    tous les propriétaires sont contactés : la valeur centrale est donc
    un MAJORANT du canal actuel (qui ne contacte qu'une fraction), ce
    qui va dans le sens conservateur pour I-15. Valeur centrale :
    0,75 %/an (3 % sur la période 2020-2024 lue comme quatre années
    pleines ; lue comme cinq, 0,6 — dans la plage). Plage plausible :
    0,25 %/an (bilan « non démontré » de la TLV, S-22) à 2,50 %/an
    (trois fois le constat, sans précédent documenté). Linéaire, sans
    cumul, sans soustraction des entrées en vacance (L-29) ; les
    sorties d'une ZE sont plafonnées par son besoin local (HD-18). DEC-08.
  central_value: 0.75
  plausible_range: [0.25, 2.5]
  unit: pct_of_effective_stock_per_year
  confidence: low
  justification:
    - S-22
    - S-52
    - L-17
  affects:
    - R-15

