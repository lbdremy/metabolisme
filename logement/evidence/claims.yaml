- id: I-08
  type: interpretation
  title: >
    Première instruction de H-05 : en métropole, la vacance structurelle
    est TERRITORIALEMENT un phénomène du bâti ancien rural — les deux
    proxys d'état (ancienneté, étiquettes F+G) convergent vers les mêmes
    territoires que R-02/R-03, du même ordre que le coût et l'emploi à
    périmètre égal (superlatif abandonné, R-08 amendé le 2026-08-07), et
    tous convergent vers la diagonale rurale. SI l'état du parc vacant
    suit celui du parc observable de ces territoires — c'est une
    hypothèse, pas une mesure : les proxys décrivent le parc occupé/en
    transaction, jamais les vacants (L-13) — alors la remobilisation du
    gisement de R-07 y passe par le coût de remise en usage (rénovation,
    mise aux normes), pas seulement par l'incitation. Le Datalab SDES
    (S-23) CONFORTE cette piste par des données logement par logement
    (×3,3 si avant 1900, ×2,8 si < 35 m², ~45 % d'obsolescence, ~20 %
    de situations successorales, ×2 si indivision ≥ 3 usufruitiers).
    Aux DOM, l'élimination progresse : ni l'emploi (I-03), ni le coût
    seul (I-04), ni les résidences secondaires (I-05), ni l'état du
    bâti (R-08) n'expliquent la vacance record — reste la piste des
    blocages de propriété (successions, indivisions), non mesurable en
    open data (frontière L-13) : à instruire par convention d'accès,
    pas à affirmer. Corrélations territoriales, pas causales.
  depends_on: [R-08, I-02, I-03, I-04, I-05, I-07, S-23]
  limitations: [L-13]

