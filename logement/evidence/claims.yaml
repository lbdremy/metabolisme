  output: data/processed/tension-manque-absolu-ze.json
  limitations: [L-05, L-06, L-12]

- id: I-07
  type: interpretation
  title: >
    À l'échelle nationale, le gisement structurel des zones tendues
    excède le manque : rendre disponibles ~286 000 logements suffirait à
    ramener toutes les ZE tendues au seuil de fluidité, et ces mêmes ZE
    contiennent ~472 000 logements structurellement vacants — la réponse
    en volume ABSOLU est donc oui (couverture 1,65, robuste sur la plage
    H-08), ce qui prolonge I-03 (la capacité sortie d'usage coexiste avec
    la demande) en le quantifiant. Mais cette suffisance est
    conditionnelle : (1) elle suppose la remobilisation d'un parc sorti
    de l'usage par définition — l'état du bâti et les blocages
    (successions, indivisions) ne sont pas instruits (H-05) ; (2) elle
    n'est PAS acquise localement dans 41 ZE sur 142, et le déficit se
    concentre dans les zones littorales et touristiques où le parc hors
    résidence principale est en résidences secondaires (R-05), pas en
    vacance — la tension touristique (catégorie 2 TLV) ne peut pas se
    résoudre par la vacance ; (3) la vacance recensement surestimant
    l'offre disponible dans les centres denses, le besoin métropolitain
    est plutôt sous-estimé (L-12).
  depends_on: [R-07, I-03, I-05]
  limitations: [L-12]

