# evidence/decisions-2026-09-18.md (DEC-nn). REVUS et intégrés le même
# jour (revue contradictoire 2026-09-18, 61 objections : compte rendu
# evidence/revue-contradictoire-2026-09-18.md) — les nœuds ci-dessous
# sont l'état APRÈS revue ; l'état d'avant est au commit 0498b4c.

# ----------------------------------------------------- valeurs (INTRO §17)

- id: V-02
  type: value
  title: >
    Stabilité du domicile : l'occupation d'une résidence principale ne
    peut pas être remise en cause au nom d'un meilleur rendement du parc
    (INTRO.md §17). Aucun mécanisme comparé ne déplace un occupant ;
    l'acquisition de M-B ne porte que sur des vacants durables (D-10).
    PRÉCISÉ par la revue (HD-8) : la bascule M-D, elle, TOUCHE les
    logements occupés — par une charge annuelle, pas par un
    déplacement — et cette charge est en tension avec le droit à
    l'ancrage (V-03) : c'est dit dans R-17/I-17, pas caché ici.
  depends_on: [V-01]

- id: V-03
  type: value
  title: >
    Mobilité volontaire et droit à l'ancrage : le système doit augmenter
    les possibilités de déménagement sans créer d'obligation de partir ;
    les liens avec un lieu sont des usages réels (INTRO.md §17). La
    bascule M-D redistribue des ménages qui restent vers ceux qui
    bougent, et une charge uniforme par logement pèse plus, en
    proportion, sur les biens de faible valeur (R-17, SE-9) : c'est un
    arbitrage de valeur, pas un résultat — le droit à l'ancrage est
    l'objection à M-D autant que sa justification.
  depends_on: [V-01]

- id: V-04
  type: value
  title: >
    Accessibilité, qualité, soutenabilité, transparence (INTRO.md §17) :
    un logement supportable économiquement (le loyer d'équilibre se
    compare au loyer SOCIAL local et au loyer de MARCHÉ — deux lectures,
    attribution et fluidité, publiées toutes deux depuis la revue,
    SE-7), pas de capacité au prix de l'insalubrité (rénovation complète
    et performante, H-09/H-10), remise en usage comparée au neuf
