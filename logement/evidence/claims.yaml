    propriétaires qui engagent les travaux).
  depends_on: [H-12, S-22, S-23]

- id: L-18
  type: limit
  title: >
    Équivalence-unité non établie : un logement durablement vacant
    n'est pas un logement du besoin. La vacance durable est biaisée
    vers les petits logements anciens (S-23 : ×2,8 si < 35 m², ×3,3 si
    construit avant 1900, ~45 % d'obsolescence ; recoupé par S-22
    p. 18) : compter « un vacant remobilisé = une unité de détente »
    (C-06) assimile des studios anciens, souvent obsolètes, aux
    logements que demandent les ménages en tension ; R-09 applique en
    outre les surfaces moyennes du parc OCCUPÉ (S-12) à un gisement
    plus petit que ce parc. Frontière de données : la distribution
    taille × époque des vacants exige les fichiers LOVAC détaillés
    (accès restreint, cf. H-06). Porte sur R-07 (couverture en unités
    hétérogènes) et R-09 (coût par logement moyen).
  depends_on: [S-22, S-23, S-12, L-12]

- id: L-19
  type: limit
  title: >
    Stock vs flux : le besoin de détente de R-07 est un besoin de
    STOCK à date (ramener la vacance disponible au seuil H-08, une
    fois). La formation de ménages se poursuit (~0,92 %/an sur
    2016-2022, R-01) : appliquée au parc des ZE tendues (~15,3 M de
    logements), elle représente ~140 000 ménages supplémentaires par
    an, alors que l'excédent du gisement effectif sur le besoin est
    d'environ 12 000 logements au central — moins d'un an de flux. La
    remobilisation est donc un gain UNIQUE qui ne dispense pas du flux
    de construction ; le flux nécessaire n'est pas instruit à la
    maille ZE par la chaîne. Porte sur R-07/I-07 et sur la conclusion
    I-10.
  depends_on: [R-01, R-07]

- id: L-20
  type: limit
  title: >
    Effets de la détente non chiffrés : (1) l'effet-prix recherché
    (détendre, c'est faire baisser les loyers relatifs) a des perdants
    patrimoniaux — propriétaires occupants comme bailleurs — dont la
    résistance est un paramètre institutionnel, pas un résidu ; (2) la
    structure d'incitation des propriétaires n'est pas modélisée :
    l'investissement de R-09 est privé, il faut donc subvention ou
    contrainte, et le bilan documenté des instruments incitatifs
    existants est faible (TLV/THLV « non démontré », missions IGF/IGEDD
    2016 et 2023 via S-22) ; (3) les territoires détendus — le régime
    « intensité » de I-02, où est la majorité du gisement national —
    sont laissés entiers par une politique de détente des seules zones
    tendues ; (4) l'attribution des logements remis en marché (qui s'y
    loge, à quel loyer) n'est pas traitée. À instruire dans la future
    proposition institutionnelle (P-xx). Porte sur I-09/I-10.
  depends_on: [S-22, I-02]

- id: L-21
  type: limit
  title: >
    Portée du mot « besoin » : les 194 488 logements de R-07 sont un
    besoin de FLUIDITÉ au sens D-15/H-08 (le volant de vacance
    disponible manquant pour que les marchés tendus tournent), PAS le
    « besoin de logements » du débat public — ni le besoin en FLUX de
    construction (les estimations publiques courantes vont d'environ
    210 000 à 518 000 logements/an selon le périmètre et la méthode),
    ni la file d'attente du logement social (~2,7 millions de demandes
    actives). Ces ordres de grandeur de contexte n'ont pas de source
    figée S-xx dans le registre et n'entrent dans AUCUN calcul de la
    chaîne ; ils bornent seulement ce que « le gisement couvre le
    besoin » veut dire — et ne pas dire. Porte sur R-07/I-07/I-10.
  depends_on: [D-15, H-08]

