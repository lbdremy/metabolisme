# ------------------- revue contradictoire (2026-08-07) — limites transverses

- id: L-16
  type: limit
  title: >
    Échelle infra-ZE : la couverture de R-07 est calculée à la maille
    zone d'emploi — elle suppose que le gisement se déplace librement à
