    par l'achat a un prix explicite : plus d'une demi-année de niveau
    de vie médian en pur péage non récupérable dans les zones tendues
    (jusqu'à un an à Paris, Bayonne, dans les DOM chers et sur les
    littoraux touristiques), 5,81 mois en médiane pour le
    primo-accédant (scénario 5,81 %) — le ménage locataire des zones
    tendues est pris en tenaille : la relocation locative y absorbe de
    ~27 % (médiane nationale) à ~64 % (Paris) du revenu (R-06) et la
    sortie par l'achat paie d'abord ce péage. La géographie du péage
    n'est PAS une confirmation indépendante du gel — elle re-exprime
    celle des prix (rho mois × prix +0,98), et les quatre croisements
    H-04 partagent le même étalon (L-26) ; l'apport propre de R-14 est
    ailleurs : le NIVEAU du péage, son incidence maximale sur la
    mobilité répétée (10-13 % de niveau de vie annuel pour un ménage
    mobile tous les 5 ans, 2,6 % amorti sur 20 ans), et sa
    décomposition : ~83 % est FISCAL (droits + CSI) — un paramètre
    INSTITUTIONNEL direct, matière pour la proposition (P-xx), avec
    la littérature comparative à l'appui (coûts de transaction
    français parmi les plus lourds de l'OCDE). La part de causalité du
    péage dans le gel n'est pas identifiée (descriptive) ; le test
    possible : les discontinuités départementales S-31 × volumes DVF —
