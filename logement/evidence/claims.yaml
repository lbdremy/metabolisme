- id: C-10
  type: choice
  title: >
    Assiette des prix de transaction DVF (S-30) : ventes
    (nature_mutation « Vente ») portant EXACTEMENT UN local
    d'habitation (une Maison ou un Appartement) et aucun local
    industriel/commercial dans la mutation (dépendances admises — une
    mutation DVF partage sa valeur_fonciere entre toutes ses lignes,
    les mutations multi-logements rendraient le prix du logement
    indéterminé) — l'assiette vise l'ACHAT UNITAIRE d'un ménage et ce
    qu'elle retranche est publié (O-34 : ~34 % des logements vendus
    changent de main en mutations multi-logements, hors champ par
    construction). Bornes de plausibilité : valeur ≥ 5 000 €, surface
    ≥ 10 m², prix/m² entre 200 et 30 000 € (ventes à l'euro symbolique
    et coquilles de saisie) — les ventes hors bornes sont marquées et
    comptées par ZE, jamais silencieusement supprimées, et les ZE où
    elles dépassent 10 % de l'assiette portent un avertissement
    nominatif (petites ZE antillaises ; revue 2026-08-09, HD-6/HD-7) ;
    médianes par ZE (robustes aux queues) ; classements réservés aux
    ZE d'au moins 100 ventes (seuil publié, symétrique du seuil de
    parc R-12). Codes commune re-normalisés (zéro initial), PLM par
    arrondissement → commune parente.
  depends_on: [S-30]

