# ---------------------------------------------------------- proposition

- id: P-01
  type: proposal
  title: >
    Architecture proposée (assemblée après comparaison, C-11 ;
    REQUALIFIÉE par la revue, C-15) — un OPÉRATEUR COLLECTIF DE DÉTENTE
    des zones tendues : (1) il ACQUIERT les vacants durables (> H-06) à
    la valeur vénale plus remploi (M-B, C-12) — c'est l'outil qui
    sécurise le volume, et il reste À CRÉER en droit (utilité publique
    d'une acquisition de logements vacants, D-22) ; (2) il OFFRE, avant
    d'acquérir, un bail à réhabilitation (M-C : travaux au Livret A,
    loyer d'équilibre ~3,7 €/m², bien rendu rénové après 30 ans) — sans
    compter dessus : à prix de repli égal à la valeur vénale, la cession
    domine (I-16), et le prix de repli qui rendrait l'offre préférable
    est un paramètre non chiffré ; (3) il ARBITRE au m², logement par
    logement, entre acquérir-rénover (3 776 €/m² médian) et construire
    sur friches (2 550 €/m², R-10 : le foncier suffit). Financement par
    prêts PLUS portés par des loyers PROCHES DU MARCHÉ (14,4 €/m²
    médian rénové, 11,5 neuf, contre 12,3 de marché) : l'opérateur
    produit du logement disponible au prix du marché — ce que le besoin
    de fluidité demande — pas du logement social sans subvention : la
    ramener au loyer social coûte 1,56 Md€/an au central (0,17-2,83
    sur les coins), 8 000 € par logement et par an, sur 40 ans ; au
    loyer de marché 0,31 Md€/an. Ordre de grandeur : 61,8 Md€
    d'investissement (6,2 Md€/an sur 10 ans, ~19 400 logements/an),
    annuité 2,38 Md€/an — contre 271 M€/an de TLV et 11,9 Md€ de DMTO
    départementaux (O-37). Attribution : au loyer d'équilibre (fluidité)
    ou au loyer social avec la subvention (attribution) — c'est un choix
    de valeur laissé ouvert (V-04). VOIE SÉPARÉE : la bascule progressive
    de la part départementale des DMTO vers une charge de détention
    (M-D, R-17), conditionnée à la réforme de l'assiette foncière (CPO,
    S-51), régressive si uniforme, assumée comme choix de valeur (V-03)
    et non comme levier causal démontré (I-17). Sur le locatif privé,
    principes seulement (L-31). Ce que la proposition NE démontre PAS :
    le taux d'adhésion au bail et l'existence de l'outil d'acquisition
    (L-29), l'effet-prix de la détente et ses perdants (L-20, L-32),
    le flux de construction au-delà du stock — ~24 Md€/an au prix S-18,
    davantage que tout le programme (L-19, L-32).
  depends_on: [I-15, I-16, I-17, R-15, R-16, R-17, C-11, C-12, C-13, C-14, C-15, V-01, V-02, V-03, V-04, I-10]
  limitations: [L-19, L-20, L-27, L-28, L-29, L-30, L-31, L-32, L-33, L-34]

# ==========================================================================
# Article 3 (2026-09-18/19) — le flux : formation de ménages et
# construction neuve par zone d'emploi (R-18). Décisions DEC-21..DEC-28.
# REVU le 2026-09-18 (revue contradictoire « flux », 3 relecteurs, 31
# objections : compte rendu evidence/revue-contradictoire-2026-09-18-flux.md)
# — état APRÈS revue ; l'état d'avant est au commit 8317526.

- id: C-16
  type: choice
  title: >
    Mesure du flux (DEC-23, révisée DEC-25..27 après revue) : la
    formation de ménages d'une ZE est la différence des millésimes
    censitaires 2016 et 2022 (S-11, ménages D-05) sur les six années qui
    séparent leurs centres, et la croissance du parc est DÉCOMPOSÉE sur
    la même période (résidences principales, résidences secondaires,
    vacants) ; la construction est la série communale du SDES EN DATE
    RÉELLE (S-56, « Tous Logements », années closes 2013-2024), codes
    communaux ramenés au COG 2026 par les mouvements de communes
    (S-59), publiée en DEUX LECTURES — « déclarée » (les DOC remontées)
    et « estimée » (× H-21, le sous-compte documenté par le SDES) — la
    lecture estimée étant la centrale ; fenêtre centrale 2017-2022
    (alignée sur les millésimes), fenêtres 2015-2020, 2018-2023,
    2019-2024 et années closes 2023-2024 publiées à côté. Le BESOIN de
    flux d'une ZE = ménages formés / (1 − part du neuf allant en
    résidences secondaires − part de vacants 2022), sous TROIS
    affectations : aucune RS (borne basse), la part des RS dans la
    croissance OBSERVÉE du parc de la ZE 2016-2022 (centrale — c'est
    une donnée, pas une norme), la structure 2022 (borne haute). Ce
    que le ratio mesure : ménages ≡ résidences principales dans le
    recensement, donc le besoin « à structure constante » est proche de
    la croissance observée du parc — le ratio dit combien il a fallu
    construire pour produire la croissance que le recensement
    enregistre, PAS si une formation de ménages plus forte a été
    empêchée (HD-1). Les ZE dont les ménages baissent ont un besoin
    nul et un ratio indéfini ; plancher de 200 ménages formés par an
    pour les classements ET les corrélations (HD-9/ST-1).
  depends_on: [S-11, S-56, S-57, S-58, S-59, D-05, D-24, H-21, C-11]

