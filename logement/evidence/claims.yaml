    désajustement (L-15).
  depends_on: [S-22, D-14, L-12]

- id: L-17
  type: limit
  title: >
    Existence ≠ mobilisabilité : H-12 ne corrige que l'EXISTENCE des
    vacants enregistrés (faux vacants LOVAC — reloués, revendus,
    démolis, S-22) ; la mobilisabilité COMPORTEMENTALE des vrais
    vacants (successions en cours — ~20 % de la vacance durable selon
    S-23 —, rétention volontaire, refus de louer) n'est PAS paramétrée,
