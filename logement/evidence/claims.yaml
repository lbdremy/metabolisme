    opérateur sans acquisition (bail à réhabilitation) ; M-D bascule du
    péage fiscal de transaction vers la détention ; M-E sécurisation de
    la mobilité locative (non chiffré, L-31). Aucun mécanisme n'est
    défendu d'avance ; la proposition P-01 est assemblée APRÈS la
    comparaison. Les coûts de rénovation restent au central H-09/H-10
    (sensibilité déjà dans R-09, DEC-12) ; H-08/H-12 ne sont pas
    propagées dans R-16 — le besoin varie d'un facteur ~4,6 sur la
