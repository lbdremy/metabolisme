    la composante cyclique n'est pas séparée. Le gradient territorial
    de la chute est porté par le niveau initial (rho partiel ≈ 0 à
    niveau 2012 contrôlé) : COMPATIBLE avec une mobilité empêchée, il
    ne la démontre pas ; l'argument antérieur (« le sens opposé
    niveau/chute écarte l'explication structurelle ») était logiquement
