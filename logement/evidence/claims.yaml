- id: I-18
  type: interpretation
  title: >
    REQUALIFIÉE par la revue (HD-1, SE-1, SE-2, ST-1, SA-1). Ce que la
    mesure établit : sur 2016-2022, la construction a produit la
    croissance du parc que le recensement enregistre, en France (1,14)
    comme dans les zones tendues (1,08 ; 1,29 sans les résidences
    secondaires) — où elle est deux fois plus intense qu'ailleurs par
    logement existant et où le ratio CROÎT avec le coût (rho + 0,20 au
    plancher) : à la maille des zones d'emploi, on n'a pas construit
    moins là où c'est cher. Ce que la mesure ne peut PAS établir : que
    le flux « couvrait le besoin » — ménages et résidences principales
    étant la même chose dans le recensement, le besoin à structure
    constante est la croissance observée, et une formation de ménages
    empêchée par le parc lui-même est invisible (la ZE de Paris
    construit 1,8 fois sa croissance et forme peu de ménages pour son
    parc : cause ou conséquence, la chaîne ne tranche pas). Le
    déficit de la fenêtre 2017-2022 est littoral et alpin (38 ZE, 13 %
    du neuf en résidences secondaires en zones tendues, jusqu'à 73 % en
    Tarentaise) : là, le problème est l'affectation de la construction,
    pas son volume. Mais l'énoncé qui compte est celui des ANNÉES
    CLOSES : depuis 2023, la construction s'est effondrée d'un tiers, et
    dans les zones tendues elle ne couvre plus que 69 % du besoin de
    flux 2016-2022 — 77 ZE sur 97 en déficit, Toulouse, Bordeaux,
    Nantes, Montpellier, Marseille en tête. À ce rythme, le stock de
    détente de P-01 (194 488, soit 1,3 an de formation de ménages) est
    consommé en trois ans par le déficit de flux des ZE qui en portent
    86 %. Conséquence pour P-01 : la détente par le stock n'a de sens
    que si le flux revient au niveau 2017-2022 ; sinon l'opérateur
    (19 400 logements/an au rythme de dix ans) couvre un tiers du
    déficit courant des zones tendues — le flux, pas le stock, est
    devenu la contrainte dominante (L-32, L-34).
  depends_on: [R-18, I-07, R-16, P-01, L-32, O-41]
  limitations: [L-19, L-34]

- id: L-34
  type: limit
  title: >
    Flux (COMPLÉTÉE par la revue) : (1) SOUS-COMPTE — la série communale
    ne voit que les déclarations remontées ; le facteur H-21 est
    national et uniforme alors que la non-remontée varie par
    département (p10-p90 1,11-1,31 en date de prise en compte, revue
    ST/SA) : les soldes par ZE portent cette incertitude, de l'ordre de
    ± 10 % des commencés ; (2) un logement commencé n'est pas livré et
    Sitadel ne voit ni démolitions ni changements d'usage — l'écart
    commencés estimés − croissance du parc (66 318/an) dépasse la mesure
    directe des sorties nettes (27 000/an, O-42) : le reste est
    commencé non livré, annulé après DOC, ou lissage censitaire, et
    l'écart change de signe selon la fenêtre (HD-5) — jamais un chiffre
    de démolitions ; (3) l'AFFECTATION du neuf aux résidences
    secondaires est une hypothèse : la part observée dans la croissance
    du parc 2016-2022 est le central, sans RS et structure 2022 les
    bornes — elle se vérifierait par ZE avec le fichier détail RP2022
    (année d'achèvement × catégorie, non figé) ; (4) le besoin de flux
    maintient la vacance de 2022, que R-07 juge insuffisante en zones
    tendues (H-08) : « couvrir le flux » n'ajoute aucune vacance de
    fluidité — le stock et le flux sont deux besoins qui s'ajoutent, et
    la production de P-01 n'est pas nettée du flux ; (5) les ménages
    censitaires 2016 et 2022 sont des moyennes de fenêtres d'enquêtes
    (2014-2018, 2020-2024, quatre collectes pour 2022) : la formation
    est lissée ; (6) la maille ZE masque l'infra-ZE (construire en
    périphérie couvre le ratio sans détendre le centre) ; (7) rien ici
    n'est causal (I-18) ; (8) 2025 : autorisations seulement (S-56) —
    la reprise ou non du flux se lira en 2027. Porte sur R-18/I-18.
  depends_on: [D-24, S-56, S-57, S-58, S-60, S-11, H-21, L-19]
