    est déclaratif — le recoupement RPLS croise des périmètres voisins,
    pas identiques ; (2) millésime 2022 = enquêtes 2020-2024 moyennées
    (l'EAR 2021 a été reportée : quatre enquêtes), dont années COVID —
    le niveau 9,87 % est une moyenne de fenêtres sur une série
    descendante, pas un niveau courant (S-33 : 8,8 % en 2023) ;
