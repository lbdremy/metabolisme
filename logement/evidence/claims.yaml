# ------------------------------------------------------------ transformations

- id: T-01
  type: transformation
  title: >
    Lecture et normalisation des fichiers figés : libellés (espaces
    insécables), années provisoires « (p) », lignes de niveau catégorie,
    invariant de sommation (catégories = ensemble, tolérance 1 millier).
  depends_on: [O-01, O-02, O-03]
  produced_by: src/logement/core/parc.py

- id: T-02
  type: transformation
  title: >
    Indexation base 100 (première année commune, 1982), taux de croissance
    annuels moyens par période intercensitaire, parts de catégories dans
    l'ensemble du parc.
  depends_on: [T-01]
  produced_by: src/logement/core/parc.py

- id: T-03
  type: transformation
  title: >
    Lecture des fichiers LOVAC (cp1252, « s » de secret → valeur manquante,
    séparateurs de milliers insécables, millésimes normalisés à 4 chiffres),
    agrégation des arrondissements PLM en communes (avec propagation du
    secret), calcul des taux de vacance structurelle au millésime de
    référence (C-03).
  depends_on: [O-04, C-03]
  produced_by: src/logement/core/lovac.py

- id: T-04
  type: transformation
  title: >
    Croisement vacance × emploi par zone d'emploi : agrégation de la vacance
    structurelle communale LOVAC par ZE 2020 (arrondissements PLM ramenés à
    leur commune parente — la feuille COM de S-06 ne les contient pas),
    dynamique d'emploi 1998-2018 en taux annuel moyen, corrélation de rangs.
  depends_on: [O-04, O-05, O-06, T-03]
  produced_by: src/logement/core/ze.py

# ------------------------------------------------------------------- résultats

- id: R-01
  type: result
  title: >
    Comparaison parc / ménages / population 1982-2025 : indices au dernier
    millésime commun (2022 : logements 156,2 · ménages 155,2 · population
