    les deux mesures de LOGEMENTS : (1) le +0,80 (R-11 × R-13) est une
    cohérence interne du recensement entre l'unité logement et l'unité
    personne (deux variables, deux pondérations, mais le même appareil
    EAR — il ne protège pas d'un artefact commun de collecte) ; la
    validation réellement externe est le recoupement MIGCOM-HLM
    8,34 % ≈ RPLS 8,0-8,5 % (O-29), qui relie les deux chaînes de
    mesure par deux appareils disjoints ; (2) la mobilité annuelle
    repose massivement sur le locatif privé — 2,3 × le parc social,
    3,4 × la propriété, en taux d'ENTRÉES dans le segment (L-24) :
    tout ce qui rétrécit ou renchérit ce segment (R-04/R-06) comprime
    le canal principal des mobilités ; (3) les soldes internes
    négatifs des cœurs chers (Paris −1,40 %/an) ont le profil par âge
    du CYCLE DE VIE métropolitain (O-36 : entrées 15-24, sorties
    nettes aux âges famille et retraite — un trait ancien, déjà
    documenté en 2012) : ils ne peuvent pas être publiés comme indice
    de blocage ; l'éviction par les prix reste une question OUVERTE
    (l'âge ne dit pas le motif ; le croisement avec l'emploi récent
