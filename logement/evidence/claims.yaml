  depends_on: [O-04, O-05, O-09, O-14, O-15, C-03, C-06]
  produced_by: src/logement/core/tension.py

- id: R-07
  type: result
  title: >
    Tension des usages et manque absolu par zone d'emploi (305 ZE,
    recensement 2022, LOVAC mill. 24, zonage TLV 2025, H-08 = 6 %) :
    142 ZE tendues en vacance disponible (23,8 M de logements de parc,
    dont les 8 grandes métropoles TLV — que le test « vacance totale »
    manquait toutes sauf une) ; besoin absolu national de détente
    285 665 logements à rendre disponibles, gisement structurel dans ces
    mêmes ZE 472 022, couverture 1,65 (1,90 au seuil 5 %, 1,15 à 7 %) ;
    couverture locale acquise dans 101 ZE sur 142 (17,3 M de parc),
    manquante dans 41 (6,5 M) — les pires couvertures sont littorales et
    touristiques (Les Sables-d'Olonne 0,20, Pornic 0,27, Calvi 0,33,
    Le Mont Blanc, Briançon, Royan, Fréjus ≤ 0,45) ; plus gros besoins
