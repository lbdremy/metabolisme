    7,7 % en 2025 ; 1 895 → 2 962 milliers), part des résidences secondaires
    (9,5 % → 9,8 %), croissances annuelles par période, écart RP/ménages aux
    millésimes (±0,3 %).
  depends_on: [T-02, V-01]
  produced_by: src/logement/shell/build.py
  output: data/processed/parc-menages.json
  limitations: [L-01, L-02, L-03]

- id: R-02
  type: result
  title: >
    Vacance structurelle du parc privé : ~1,15 M de logements au dernier
    millésime pré-rupture (24, choix C-03 — ~1,1-1,2 M stables sur
    2020-2026 ; le millésime 26 donne 1,18 M mais est post-GMBI, source
    dégradée, L-04), taux national 3,5 % au millésime 24, gradient
    départemental d'un ordre de grandeur (DOM 10-27 % et diagonale des
    faibles densités 7-9,5 % contre 1,4-1,7 % en zones tendues), volumes
    concentrés dans les grandes villes (Paris 32 091, Marseille 14 529,
    PLM agrégées) à des taux proches de la moyenne, statistiques de
    secrétisation communale.
  depends_on: [T-03, H-06, V-01]
  produced_by: src/logement/shell/build.py
  output: data/processed/vacance-structurelle.json
  limitations: [L-04, L-05, L-06]
  notes: >
    Précisé le 2026-08-07 (revue contradictoire) : le volume-titre
    s'entend au dernier millésime pré-rupture (cohérent avec le
    millésime de référence des taux, C-03) — l'énoncé initial mettait
    en avant le millésime 26, premier régime post-GMBI. Contrôle
    externe parisien (S-24) : l'Apur compte ~18 600 vacants > 2 ans du
    parc privé en 2022 contre 32 091 au millésime 26 LOVAC — écart à
    instruire, documenté en L-04.

- id: R-03
  type: result
  title: >
    Vacance structurelle × dynamique d'emploi par zone d'emploi (millésime
    LOVAC 24, emploi 1998-2018, 305 ZE) : corrélation de Spearman −0,36
    (IC de Fisher à 95 % [−0,45 ; −0,26] ; métropole seule : −0,47
    [−0,55 ; −0,37]) ; les 63 ZE à emploi déclinant portent 15,1 % de la
    vacance structurelle VISIBLE pour 9,8 % du parc privé (taux médian
    4,5 % contre 2,9 % ailleurs) ; borne de secrétisation publiée dans
    l'artefact : 26 927 communes masquées (≤ 10 structurels chacune)
    encadrent la part déclinante entre 12,2 et 21,7 % — la part de la
    vacance structurelle en ZE où l'emploi croît est donc de 78 à 88 %
    (84,9 % au visible ; Paris 69 803, Marseille 17 917).
  depends_on: [T-04, H-06, V-01]
  produced_by: src/logement/shell/build.py
  output: data/processed/vacance-emploi-ze.json
  limitations: [L-05, L-06, L-07, L-08]
  notes: >
    Harmonisé le 2026-08-07 (revue contradictoire) : IC de Fisher et
    Spearman par périmètre (France entière / métropole) publiés dans
    l'artefact ; le « ~85 % » initial était calculé sur la seule masse
    visible sans l'encadrement — la borne [78 ; 88] % est désormais
    publiée avec lui.

# -------------------------------------------------------------- interprétations

- id: I-01
  type: interpretation
  title: >
    Sur 40 ans le parc suit les ménages (et non la population) : la croissance
    du parc accompagne la décohabitation. Le régime change vers 2005-2006 :
    avant, les ménages croissent plus vite que le parc et la vacance se
    résorbe ; après, le parc croît plus vite et la vacance remonte — au niveau
    national, la capacité hors résidence principale qui augmente depuis 2006
    est de la vacance, pas des résidences secondaires.
  depends_on: [R-01]
  limitations: [L-01, L-02]

- id: I-02
  type: interpretation
  title: >
    « Où est la vacance » a deux réponses : en intensité, les taux élevés
    sont ultramarins et ruraux (diagonale des faibles densités) — premier
    indice cohérent avec H-02 (capacités mal localisées) ; en volume, les
    grandes villes dominent à des taux proches de la moyenne. Tout mécanisme
    de remise en usage devra traiter ces deux régimes distincts.
  depends_on: [R-02]
  limitations: [L-04, L-05, L-06]
  notes: >
    Précisé le 2026-08-07 (revue contradictoire) : les volumes-titres se
    lisent au millésime pré-rupture (R-02 amendé) — la lecture « deux
    régimes » est insensible au choix du millésime, les gradients étant
    stables sur 2020-2026 ; le régime « intensité » (DOM, rural) est
    aussi celui où la variante d'assiette de C-06 montre des ZE
    « tendues par vacance structurelle record » (circularité documentée
    dans C-06/L-12).

- id: I-03
  type: interpretation
  title: >
    L'hypothèse directrice H-02 (capacités mal localisées) est confirmée en
    intensité — la vacance structurelle est sur-représentée (×1,5) et deux
    fois plus fréquente dans les ZE à emploi déclinant — mais réfutée comme
    explication dominante en volume : 78 à 88 % de la vacance structurelle
    (bornes de secrétisation incluses, 84,9 % au visible) se trouve dans
    des zones d'emploi où l'emploi croît — la lecture SURVIT sur toute la
    borne. La majorité de la capacité sortie d'usage coexiste donc avec la
    demande — les causes de blocage sont à chercher ailleurs (état du
    bâti, successions, coût, inadéquation infra-ZE : H-03, H-05).
  depends_on: [R-03]
  limitations: [L-07, L-08]

# --------------------------------------------------------- branche coût (H-03)

- id: L-09
  type: limit
  title: >
    Limites du croisement coût : loyers d'annonce (relocation, pas le parc
    en place) modélisés, millésime 2025, rapportés à des revenus Filosofi
    2021 (dernier disponible) ; l'indice loyer/revenu n'est pas un taux
    d'effort (D-09 — ni surface ni composition de ménage) ; 8 ZE absentes
    (Guadeloupe, Guyane hors Filosofi) ; licence du millésime loyers 2025
    non précisée sur data.gouv — à confirmer avant publication.
    COMPLÉTÉ le 2026-08-07 (revue contradictoire) — DIRECTION des
    biais, jusqu'ici tue : loyers 2025 rapportés à des revenus 2021,
    soit ~4 ans de croissance nominale des revenus non corrigée → les
    NIVEAUX (indice de coût R-04, taux d'effort R-06) sont SURESTIMÉS ;
    les loyers de la carte sont charges comprises → même sens. Les
    biais étant communs à toutes les ZE, les CLASSEMENTS et
    corrélations de rangs y sont insensibles ; Filosofi 2022 a été
    annulé par l'INSEE (2021 = dernier millésime, vérifié) — pas de
    variante indexée possible avec les données figées.
  depends_on: [S-09, S-10, D-09]

- id: O-07
  type: observation
  title: >
    Loyers d'annonce prédits par commune (€/m², appartements, charges
    comprises), millésime 2025.
  depends_on: [S-09]

- id: O-08
  type: observation
  title: >
    Médiane du niveau de vie (MED_SL, €/UC/an) par zone d'emploi 2020,
    Filosofi 2021.
  depends_on: [S-10]

- id: T-05
  type: transformation
  title: >
    Indice de pression du coût par ZE : loyer moyen pondéré par le parc
    privé LOVAC (arrondissements PLM ramenés à la commune parente), loyer
    annuel d'un m² rapporté au niveau de vie médian, croisé avec le taux de
    vacance structurelle (corrélation de rangs).
  depends_on: [O-04, O-05, O-07, O-08, C-03]
  produced_by: src/logement/core/cout.py

- id: R-04
  type: result
  title: >
    Pression du coût résidentiel × vacance structurelle par zone d'emploi
    (297 ZE) : corrélation de Spearman −0,43 (IC de Fisher à 95 %
    [−0,52 ; −0,33] ; métropole seule : −0,54 [−0,62 ; −0,45]) ; taux de
    vacance médian de 2,5 % dans la moitié des ZE au coût relatif élevé
    contre 3,9 % dans la moitié bon marché ; loyers pondérés de 8,0 à
    27,2 €/m² (Paris, indice 1,28) ; des ZE ultramarines (La Réunion —
    L'Est, L'Ouest, Le Sud — et Martinique — Le Sud) cumulent coût
    relatif parmi les plus élevés (1,01-1,16, porté par la faiblesse des
    revenus) et vacance au-dessus de la moyenne (3,8-8,7 %).
  depends_on: [T-05, H-06, V-01]
  produced_by: src/logement/shell/build.py
  output: data/processed/cout-residentiel-ze.json
  limitations: [L-05, L-06, L-09]
  notes: >
    Harmonisé le 2026-08-07 (revue contradictoire) : IC de Fisher et
    périmètres publiés, agrégation min_count unifiée (le Spearman passe
    de −0,42 à −0,43, la moitié bon marché de 4,0 à 3,9 % — aucun
    changement de lecture) ; direction des biais de niveau documentée
    en L-09.

- id: I-04
  type: interpretation
  title: >
    Le coût résidentiel est un marqueur de tension, pas la cause de la
    vacance : là où le coût relatif est élevé le parc est presque
    entièrement utilisé (le coût y limite l'accès des ménages — à instruire
    avec un vrai taux d'effort), là où la vacance est forte le logement est
    bon marché. Combiné à I-03, le blocage de la capacité sortie d'usage en
    zone dynamique paraît relever du niveau propriété/bâti ou infra-
    territorial plutôt que du prix territorial. Le cumul coût élevé ET
    vacance élevée est ultramarin (La Réunion, Martinique — d'abord
    identifié à tort comme corse, corrigé par vérification des codes ZE) :
    il prolonge le constat DOM de R-02 et tient à la faiblesse des revenus,
    pas aux résidences secondaires — l'exploration 05 montre qu'à l'échelle
    ZE les territoires à forte part de résidences secondaires ont une
    vacance structurelle PLUS BASSE que les autres.
  depends_on: [R-04, I-03]
  limitations: [L-09]

# --------------------------------------- branche résidences secondaires (I-02/I-04)

- id: L-10
  type: limit
  title: >
    Limites du croisement résidences secondaires : parc entier côté
    recensement vs parc privé côté LOVAC (L-06) ; géographie COG 2025
    (S-11) vs COG 2026 (S-06) — jointure sans perte constatée mais à
    revérifier à chaque millésime ; l'échelle ZE dilue les effets
    communaux (stations, littoral) — les effets d'éviction infra-
    territoriaux ne sont pas mesurés par ces indicateurs.
  depends_on: [S-11, S-06, L-06]

- id: O-09
  type: observation
  title: >
    Comptages du recensement 2022 par commune : logements, résidences
    principales, résidences secondaires et occasionnels, logements vacants
    (millésimes 2011/2016/2022, géographie 2025).
  depends_on: [S-11, D-01, D-02, D-03, D-04]

- id: T-06
  type: transformation
  title: >
    Part des résidences secondaires par zone d'emploi : agrégation des
    comptages communaux du recensement (arrondissements PLM dédupliqués vers
    la commune parente), parts de catégories, croisement avec le taux de
    vacance structurelle LOVAC et l'indice de coût (corrélations de rangs,
    groupe « touristique » à plus de 20 % de RS, cumuls RS + vacance > 5 %).
  depends_on: [O-09, O-05, T-03, T-05]
  produced_by: src/logement/core/rs.py

- id: R-05
  type: result
  title: >
    Résidences secondaires × coût × vacance par zone d'emploi (297 ZE,
    recensement 2022) : part nationale 9,7 % (jusqu'à 65,5 % à Briançon) ;
    corrélation avec la vacance structurelle FAIBLE MAIS SIGNIFICATIVE
    (+0,15, IC de Fisher à 95 % [0,04 ; 0,26]) et de signe POSITIF, alors
    que le contraste de groupe est négatif — les 56 ZE à plus de 20 % de
    RS ont une vacance structurelle PLUS BASSE (médiane 2,5 % contre
    3,2 %) : relation non monotone / effet de structure ; corrélation
    avec l'indice de coût compatible avec zéro (−0,05 [−0,16 ; 0,06]) ;
    8 ZE cumulent RS > 20 % et vacance > 5 %, dont quatre corses (Corte
    39,1 %/6,9 %, Ghisonaccia, Porto-Vecchio, Propriano) et des ZE
    rurales touristiques (Ussel, Millau, Saint-Flour).
  depends_on: [T-06, V-01]
  produced_by: src/logement/shell/build.py
  output: data/processed/residences-secondaires-ze.json
  limitations: [L-05, L-06, L-09, L-10]
  notes: >
    Corrigé le 2026-08-07 (revue contradictoire) : l'énoncé initial
    disait « sans lien » (+0,17) — le rho harmonisé (agrégation
    min_count) est +0,15 et son IC exclut zéro : la corrélation est
    faible mais significative, et son signe (positif) est OPPOSÉ au
    contraste touristique (négatif) — la non-monotonie est désormais
    dite. La liste des cumuls RS + vacance passe de 12 à 8 ZE (même
    correction min_count : les taux corses baissent, Corte 10,4 → 6,9).

- id: I-05
  type: interpretation
  title: >
    À l'échelle des zones d'emploi, la part de résidences secondaires
    n'explique ni la vacance ni le coût — conclusion inchangée, énoncée
    honnêtement depuis la revue contradictoire (2026-08-07) : la
    corrélation RS × vacance n'est pas nulle mais faible, significative
    (+0,15 [0,04 ; 0,26]) et de signe OPPOSÉ au contraste touristique
    (les ZE les plus touristiques ont une vacance plus basse) — un effet
    de structure territorial, pas un mécanisme explicatif ; RS × coût
    est compatible avec zéro. Les grands marchés touristiques (stations
    alpines, littoral varois) gardent leur parc en usage — comme
    résidence secondaire précisément — et la « capacité saisonnière
    retirée » (INTRO §7) réside dans la catégorie RS elle-même et ses
    effets d'éviction infra-territoriaux, pas dans la vacance. Le cumul
    RS + vacance existe dans un sous-groupe corse et rural-touristique
    (R-05) — cas d'étude communaux pour la suite. Cette exploration a
    aussi permis de corriger l'identification des ZE à coût et vacance
    élevés de R-04 : ultramarines (La Réunion, Martinique), non corses.
