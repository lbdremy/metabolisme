# ------------------------------------------------------- interprétations

- id: I-15
  type: interpretation
  title: >
    REQUALIFIÉE par la revue (SE-1/HD-1/ST-1). Le canal incitatif ne
    peut pas être le mécanisme de la détente : même lu comme si tous
    les propriétaires étaient contactés, il livre moins d'un dixième du
    besoin en dix ans (R-15), sur toute la plage de H-14 — c'est le
    seul énoncé de la comparaison qui ne dépend d'aucune hypothèse
    nouvelle. La seule voie qui SÉCURISERAIT le volume — un opérateur
    qui porte le bien (M-B) — suppose un outil de contrainte qui
    n'existe pas (C-15) et paie le prix du marché des zones tendues :
    un vacant acquis et rénové y coûte plus par m² qu'un logement
    social neuf (R-16), ce qui rend caduc « remobiliser coûte deux
    fois moins que construire » (I-09) dès qu'il faut acquérir. Le
    loyer d'équilibre qui en résulte est PROCHE DU MARCHÉ (1,14 × en
    médiane ; sous le marché dans une ZE sur cinq et dans presque
    toutes à la moindre décote) et ~2 × le loyer social : l'opérateur
    ne produit pas du logement social sans subvention (1,6 Md€/an au
    central, 8 000 € par logement et par an), il produit du logement
    au prix du marché DISPONIBLE — ce que le besoin de fluidité de
    R-07 demande (SE-7). Le segment neuf s'équilibre en dessous du
    marché dans deux ZE sur trois (11,5 €/m²), d'où le choix C-15(3)
    de laisser l'opérateur arbitrer au m² entre acquérir et construire.
  depends_on: [R-15, R-16, I-09, I-10, R-10, C-15]
  limitations: [L-27, L-29, L-30, L-32]

- id: I-16
  type: interpretation
  title: >
    REQUALIFIÉE par la revue (SE-2/HD-4) — la version initiale
    affirmait que « le repli rend l'offre de bail préférable » ; c'est
    l'inverse. Le bail à réhabilitation est le mécanisme le moins cher
    par logement (3,7 €/m², sous le loyer social partout) parce qu'il
    ne paie ni le foncier ni le bâti — mais un propriétaire à qui l'on
    garantit une acquisition à la valeur vénale n'a aucune raison
    financière de le préférer à la vente (valeur actuelle du bail 28-67
    % de la vente, SE-2) : le bail n'attire que ceux qui veulent garder
    le bien, et rien ne dit combien ils sont (L-29). Le bail est donc
    OFFERT (il abaisse le coût là où il est accepté) ; la sécurisation
    du volume vient de l'acquisition, et le paramètre qui rendrait
    l'offre préférable — un prix de repli sous la valeur vénale — est un
    choix de conception non chiffré et juridiquement non acquis (C-15).
  depends_on: [R-15, R-16, I-15, L-17, C-15]
  limitations: [L-29]

- id: I-17
  type: interpretation
  title: >
    REQUALIFIÉE par la revue (SE-9/ST-2/ST-13/HD-8). La bascule de la
    part départementale des DMTO vers la détention (M-D) est une
    REDISTRIBUTION avant d'être un outil de mobilité : elle transfère
    ~344 €/logement/an des ménages qui bougent vers ceux qui restent
    (point d'équivalence 21 ans, 29 en zones tendues — sans mesure de
    la durée de détention effective dans la chaîne) ; elle divise le
    péage à l'achat par ~1,6 (6,07 → 2,14 mois de niveau de vie), ce
    qui répond à I-14 — mais l'effet causal sur les volumes est, dans
    la seule preuve disponible, de court terme et petit (O-39), et la
    charge uniforme est régressive en valeur (0,11-0,53 % du prix
    médian), en tension avec le droit à l'ancrage (V-03). Le mécanisme
    se justifie par la valeur V-03 (ne pas taxer le comportement rare
    que H-04 déplore) et par deux recommandations convergentes (OCDE
    S-44, CPO S-51), pas par une élasticité établie ; ses conditions
    (réforme préalable de l'assiette foncière, S-51 ; phasage ;
    compensation des départements ; acquéreurs récents) sont des
    paramètres institutionnels, pas des résidus (L-28) — d'où son
    statut de voie séparée dans P-01 (C-15).
  depends_on: [R-17, O-39, I-14, V-03, C-15]
  limitations: [L-28]

