    est dans le taux mais pas dans les flux O-D) ; (4) effectifs
    pondérés < 200 imprécis (doc INSEE) — pas de flux fins entre
    petites ZE publiés ; (5) 67 communes de résidence sans ZE (COG
    2022 vs 2026) et 11 406 mobiles sans origine, exclus et publiés ;
    (6) fenêtre d'UN an : ne se compare pas au « moins de 2 ans » de
