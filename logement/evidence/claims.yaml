# ------------------------------- branche tension et manque absolu (H-02 volume)

- id: C-06
  type: choice
  title: >
    Le test de tension de marché retient la VACANCE DISPONIBLE (vacance
    totale du recensement moins vacance structurelle LOVAC, hors marché
    par construction D-10) comparée au seuil de fluidité H-08. CORRECTION
    TRACÉE (2026-08-05) : le choix initial de la session (seuil sur la
    vacance totale, périmètre de la littérature D-15) échouait au contrôle
    de cohérence — la vacance totale du recensement est haute partout
    (médiane ZE 8,6 %) et aucune grande métropole TLV n'en sortait
    « tendue » (Paris 7,7 %, Lyon 7,2 %, Marseille 7,1 %) alors qu'elles
    cumulent zonage légal, loyers extrêmes et taux d'effort R-06
    maximaux ; en retranchant la structurelle, 7 de ces 8 métropoles
    repassent sous le seuil. Le test « vacance totale » reste publié en
    sensibilité dans R-07. Le besoin absolu de détente est chiffré en
    logements à rendre disponibles (M = seuil × parc − disponibles :
    mobiliser un logement structurellement vacant ajoute une unité
    disponible sans accroître le parc) et la couverture par le gisement
    est structurelle / besoin.
  depends_on: [S-11, S-13, D-10, D-14, D-15, H-08, H-12]
  notes: >
    Complété le 2026-08-07 (revue contradictoire). (1) Taux d'existence
    H-12 : le gisement LOVAC contient ~25 % de faux vacants (S-22) —
    H-12 est propagée des DEUX côtés du test : gisement effectif =
    H-12 × structurelle ET vacance disponible = vacants recensés −
    H-12 × structurelle (les faux vacants ne sont pas non plus une
    offre disponible) ; le besoin baisse donc en même temps que le
    gisement, la chaîne publie le calcul complet. (2) Sensibilité
    d'assiette : le seuil H-08 est énoncé par la littérature sur la
    vacance TOTALE (D-15) et appliqué ici à la vacance DISPONIBLE —
    test plus sévère ; l'artefact publie la variante au seuil recalibré
    (6 % − 1,69 % de structurelle nationale = 4,31 % sur la disponible :
    28 ZE tendues, besoin 37 239, couverture 1,19, communes TLV 1,00)
    et marque les 31 ZE « tendues par vacance structurelle record »
    (gisement 76 114, 37 % du total — DOM/rural : la structurelle y
    crée la tension qu'elle est ensuite censée couvrir, circularité
    documentée, à lire avec I-02). Décision de Rémy : le test central
    est conservé SANS recalibrage, la sensibilité est publiée. Voir
    L-12 (corrigée le même jour) pour les biais du construit.

- id: L-12
  type: limit
  title: >
    Limites du croisement tension/manque — CORRECTION MAJEURE le
    2026-08-07 (revue contradictoire, deux erreurs de l'énoncé initial
    corrigées). La vacance disponible mélange deux appareils de mesure
    (recensement parc entier vs LOVAC parc privé fiscal, L-06) — la
    vacance recensement surestime l'offre réellement disponible dans les
    centres denses (Paris commune : 9,8 % de vacance totale) donc le
    besoin des métropoles est plutôt SOUS-estimé. (1) Secrétisation :
    l'énoncé initial (« la couverture est plutôt sous-estimée ») était
    FAUX au niveau national — quand le gisement excède le besoin,
    réintégrer la masse masquée (5 003 communes masquées dans les ZE
    tendues, ≤ 10 structurels chacune, masse maximale 37 522) augmente
    le gisement ET réduit le besoin : la couverture nationale DESCEND
    vers 1 (borne publiée : 1,06 → 1,05) ; le sens « sous-estimation »
    n'est vrai que dans les ZE où le besoin excède le gisement. (2)
    Vacance disponible négative : les artefacts sont 3 ZE corses
    (Corte, Ghisonaccia, Porto-Vecchio — l'énoncé initial ne citait
    qu'Ajaccio), désormais ÉCRÊTÉS à zéro dans le besoin publié
    (écrêtage 412 logements, besoin sans écrêtage publié à côté). (3)
    Bande grise : 116 ZE (dont 43 tendues) sont à ± 1 point du seuil —
    la partition tendue/non-tendue est sensible à l'erreur de construit
    de la vacance disponible. (4) Divergence étude/zonage légal,
    publiée dans les DEUX sens : 63 des 84 ZE à parc majoritairement
    TLV sont tendues au test, mais 34 ZE tendues ne sont PAS
    majoritairement TLV, dont 14 quasi sans commune TLV (< 1 % du
    parc). Restent : le seuil H-08 est un ordre de grandeur d'usage
    professionnel (confiance basse) ; millésimes mélangés (recensement
    2022, LOVAC 24, zonage TLV décembre 2025) ; « couverture » signifie
    que le volume existe, pas qu'il est mobilisable — la vacance
    structurelle est difficile à remobiliser par définition (C-01), et
    son état/coût de remise en usage n'est mesuré qu'indirectement
    (L-13, L-17).
  depends_on: [L-05, L-06, S-13, H-08, H-12]

