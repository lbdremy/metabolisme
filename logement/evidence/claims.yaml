- id: I-09
  type: interpretation
  title: >
    Le chiffrage referme la boucle ouverte par I-07 : la suffisance du
    gisement en volume (couverture 1,65) a un prix de l'ordre de 12,5
    Md€ pour la détente — un ordre de grandeur nettement inférieur au
    coût de la même détente par construction neuve (~48 Md€, ratio ~4),
    et comparable aux ordres de grandeur des politiques publiques du
    logement existantes. L'argument économique ne suffit pourtant pas :
    R-08/I-08 montrent que le verrou est aussi dans la propriété
    (successions, indivisions — DOM notamment) et L-14 rappelle que le
    chiffre est un investissement total, pas un coût public, et que la
    tension touristique des 41 ZE non couvertes reste hors de portée de
    la remobilisation. C'est la première brique quantifiée pour la
    future proposition institutionnelle (P-xx à venir).
  depends_on: [R-09, I-07, I-08]
  limitations: [L-14]
