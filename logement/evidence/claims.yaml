# --------------------------- branche coût de remobilisation (H-05, chiffrage)

- id: C-07
  type: choice
  title: >
    Modèle du coût de remise en usage (décisions du 2026-08-05) : coût
    unitaire par logement = coûts €/m² d'une rénovation complète et
    performante (H-09 maison, H-10 collectif — S-17, euros 2016 HT),
    mixés par la part maison des RP de chaque ZE (S-11), aux surfaces
    moyennes S-12 (114,3 / 65,5 m²), convertis TTC (TVA 5,5 %, S-17) et
    ACTUALISÉS 2016 → 2023 par l'indice IPEA résidentiel (S-19, facteur
    recalculé depuis le fichier figé — jamais une constante) pour être
    comparables au prix de revient 2023 du logement social neuf (S-18,
    169 200 €/logement), retenu comme comparateur « construire à la
    place » (conservateur : la promotion libre est plus chère).
