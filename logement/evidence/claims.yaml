- id: I-08
  type: interpretation
  title: >
    Première instruction de H-05 : en métropole, la vacance structurelle
    est un phénomène du BÂTI ANCIEN RURAL — les deux proxys d'état
    (ancienneté, étiquettes F+G) convergent vers les mêmes territoires
    que R-02/R-03, et la remobilisation du gisement de R-07 y passe donc
    par le coût de remise en usage (rénovation, mise aux normes), pas
    seulement par l'incitation. Aux DOM, l'élimination progresse :
    ni l'emploi (I-03), ni le coût seul (I-04), ni les résidences
    secondaires (I-05), ni l'état du bâti (R-08) n'expliquent la vacance
    record — reste la piste des blocages de propriété (successions,
    indivisions), non mesurable en open data (frontière L-13) : à
    instruire par convention d'accès, pas à affirmer. Corrélations
    territoriales, pas causales — le chiffrage du coût de remobilisation
    (qui conditionne I-07) reste à faire.
  depends_on: [R-08, I-02, I-03, I-04, I-05, I-07]
