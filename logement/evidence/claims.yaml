# ------------------------------------------------------------ transformations

- id: T-01
  type: transformation
  title: >
    Lecture et normalisation des fichiers figés : libellés (espaces
    insécables), années provisoires « (p) », lignes de niveau catégorie,
    invariant de sommation (catégories = ensemble, tolérance 1 millier).
  depends_on: [O-01, O-02, O-03]
  produced_by: src/logement/core/parc.py

- id: T-02
  type: transformation
  title: >
    Indexation base 100 (première année commune, 1982), taux de croissance
    annuels moyens par période intercensitaire, parts de catégories dans
    l'ensemble du parc.
  depends_on: [T-01]
  produced_by: src/logement/core/parc.py

- id: T-03
  type: transformation
  title: >
    Lecture des fichiers LOVAC (cp1252, « s » de secret → valeur manquante,
    séparateurs de milliers insécables, millésimes normalisés à 4 chiffres),
    agrégation des arrondissements PLM en communes (avec propagation du
    secret), calcul des taux de vacance structurelle au millésime de
    référence (C-03).
  depends_on: [O-04, C-03]
  produced_by: src/logement/core/lovac.py

- id: T-04
  type: transformation
  title: >
    Croisement vacance × emploi par zone d'emploi : agrégation de la vacance
    structurelle communale LOVAC par ZE 2020 (arrondissements PLM ramenés à
    leur commune parente — la feuille COM de S-06 ne les contient pas),
    dynamique d'emploi 1998-2018 en taux annuel moyen, corrélation de rangs.
  depends_on: [O-04, O-05, O-06, T-03]
  produced_by: src/logement/core/ze.py

# ------------------------------------------------------------------- résultats

- id: R-01
  type: result
  title: >
    Comparaison parc / ménages / population 1982-2025 : indices au dernier
    millésime commun (2022 : logements 156,2 · ménages 155,2 · population
    121,9), trajectoire de la vacance (7,9 % en 1982, minimum 6,2 % en 2005,
    7,7 % en 2025 ; 1 895 → 2 962 milliers), part des résidences secondaires
    (9,5 % → 9,8 %), croissances annuelles par période, écart RP/ménages aux
    millésimes (±0,3 %).
  depends_on: [T-02, V-01]
  produced_by: src/logement/shell/build.py
  output: data/processed/parc-menages.json
  limitations: [L-01, L-02, L-03]

- id: R-02
  type: result
  title: >
    Vacance structurelle du parc privé : 1,18 M de logements au millésime 26
    (~1,1-1,2 M stables sur 2020-2026), taux national 3,5 % au millésime 24,
    gradient départemental d'un ordre de grandeur (DOM 10-27 % et diagonale
    des faibles densités 7-9,5 % contre 1,4-1,7 % en zones tendues), volumes
    concentrés dans les grandes villes (Paris 32 091, Marseille 14 529, PLM
    agrégées) à des taux proches de la moyenne, statistiques de
    secrétisation communale.
  depends_on: [T-03, H-06, V-01]
  produced_by: src/logement/shell/build.py
  output: data/processed/vacance-structurelle.json
  limitations: [L-04, L-05, L-06]

- id: R-03
  type: result
  title: >
    Vacance structurelle × dynamique d'emploi par zone d'emploi (millésime
    LOVAC 24, emploi 1998-2018, 305 ZE) : corrélation de Spearman −0,36 ;
    les 63 ZE à emploi déclinant portent 15,1 % de la vacance structurelle
    pour 9,8 % du parc privé (taux médian 4,5 % contre 2,9 % ailleurs) ;
    84,9 % de la vacance structurelle se situe dans des ZE où l'emploi
    croît (Paris 69 803, Marseille 17 917, Lyon 12 099).
  depends_on: [T-04, H-06, V-01]
  produced_by: src/logement/shell/build.py
  output: data/processed/vacance-emploi-ze.json
  limitations: [L-05, L-06, L-07, L-08]

# -------------------------------------------------------------- interprétations

- id: I-01
  type: interpretation
  title: >
    Sur 40 ans le parc suit les ménages (et non la population) : la croissance
    du parc accompagne la décohabitation. Le régime change vers 2005-2006 :
    avant, les ménages croissent plus vite que le parc et la vacance se
    résorbe ; après, le parc croît plus vite et la vacance remonte — au niveau
    national, la capacité hors résidence principale qui augmente depuis 2006
    est de la vacance, pas des résidences secondaires.
  depends_on: [R-01]
  limitations: [L-01, L-02]

- id: I-02
  type: interpretation
  title: >
    « Où est la vacance » a deux réponses : en intensité, les taux élevés
    sont ultramarins et ruraux (diagonale des faibles densités) — premier
    indice cohérent avec H-02 (capacités mal localisées) ; en volume, les
    grandes villes dominent à des taux proches de la moyenne. Tout mécanisme
    de remise en usage devra traiter ces deux régimes distincts.
  depends_on: [R-02]
  limitations: [L-05, L-06]

- id: I-03
  type: interpretation
  title: >
    L'hypothèse directrice H-02 (capacités mal localisées) est confirmée en
    intensité — la vacance structurelle est sur-représentée (×1,5) et deux
    fois plus fréquente dans les ZE à emploi déclinant — mais réfutée comme
    explication dominante en volume : ~85 % de la vacance structurelle se
    trouve dans des zones d'emploi où l'emploi croît. La majorité de la
    capacité sortie d'usage coexiste donc avec la demande — les causes de
    blocage sont à chercher ailleurs (état du bâti, successions, coût,
    inadéquation infra-ZE : H-03, H-05).
  depends_on: [R-03]
  limitations: [L-07, L-08]

# --------------------------------------------------------- branche coût (H-03)

- id: L-09
  type: limit
  title: >
    Limites du croisement coût : loyers d'annonce (relocation, pas le parc
    en place) modélisés, millésime 2025, rapportés à des revenus Filosofi
    2021 (dernier disponible) ; l'indice loyer/revenu n'est pas un taux
    d'effort (D-09 — ni surface ni composition de ménage) ; 8 ZE absentes
    (Guadeloupe, Guyane hors Filosofi) ; licence du millésime loyers 2025
    non précisée sur data.gouv — à confirmer avant publication.
  depends_on: [S-09, S-10, D-09]

- id: O-07
  type: observation
  title: >
    Loyers d'annonce prédits par commune (€/m², appartements, charges
    comprises), millésime 2025.
  depends_on: [S-09]

- id: O-08
  type: observation
  title: >
    Médiane du niveau de vie (MED_SL, €/UC/an) par zone d'emploi 2020,
    Filosofi 2021.
  depends_on: [S-10]

- id: T-05
  type: transformation
  title: >
    Indice de pression du coût par ZE : loyer moyen pondéré par le parc
    privé LOVAC (arrondissements PLM ramenés à la commune parente), loyer
    annuel d'un m² rapporté au niveau de vie médian, croisé avec le taux de
    vacance structurelle (corrélation de rangs).
  depends_on: [O-04, O-05, O-07, O-08, C-03]
  produced_by: src/logement/core/cout.py

- id: R-04
  type: result
  title: >
    Pression du coût résidentiel × vacance structurelle par zone d'emploi
    (297 ZE) : corrélation de Spearman −0,42 ; taux de vacance médian de
    2,5 % dans la moitié des ZE au coût relatif élevé contre 4,0 % dans la
    moitié bon marché ; loyers pondérés de 8,0 à 27,2 €/m² (Paris, indice
    1,28) ; des ZE ultramarines (La Réunion — L'Est, L'Ouest, Le Sud — et
    Martinique — Le Sud) cumulent coût relatif parmi les plus élevés
    (1,01-1,16, porté par la faiblesse des revenus) et vacance au-dessus de
    la moyenne (3,8-8,7 %).
  depends_on: [T-05, H-06, V-01]
  produced_by: src/logement/shell/build.py
  output: data/processed/cout-residentiel-ze.json
  limitations: [L-05, L-06, L-09]

- id: I-04
  type: interpretation
  title: >
    Le coût résidentiel est un marqueur de tension, pas la cause de la
    vacance : là où le coût relatif est élevé le parc est presque
    entièrement utilisé (le coût y limite l'accès des ménages — à instruire
    avec un vrai taux d'effort), là où la vacance est forte le logement est
    bon marché. Combiné à I-03, le blocage de la capacité sortie d'usage en
    zone dynamique paraît relever du niveau propriété/bâti ou infra-
    territorial plutôt que du prix territorial. Le cumul coût élevé ET
    vacance élevée est ultramarin (La Réunion, Martinique — d'abord
    identifié à tort comme corse, corrigé par vérification des codes ZE) :
    il prolonge le constat DOM de R-02 et tient à la faiblesse des revenus,
    pas aux résidences secondaires — l'exploration 05 montre qu'à l'échelle
    ZE les territoires à forte part de résidences secondaires ont une
    vacance structurelle PLUS BASSE que les autres.
  depends_on: [R-04, I-03]
  limitations: [L-09]

# --------------------------------------- branche résidences secondaires (I-02/I-04)

- id: L-10
  type: limit
  title: >
    Limites du croisement résidences secondaires : parc entier côté
    recensement vs parc privé côté LOVAC (L-06) ; géographie COG 2025
    (S-11) vs COG 2026 (S-06) — jointure sans perte constatée mais à
    revérifier à chaque millésime ; l'échelle ZE dilue les effets
    communaux (stations, littoral) — les effets d'éviction infra-
    territoriaux ne sont pas mesurés par ces indicateurs.
  depends_on: [S-11, S-06, L-06]

- id: O-09
  type: observation
  title: >
    Comptages du recensement 2022 par commune : logements, résidences
    principales, résidences secondaires et occasionnels, logements vacants
    (millésimes 2011/2016/2022, géographie 2025).
  depends_on: [S-11, D-01, D-02, D-03, D-04]

- id: T-06
  type: transformation
  title: >
    Part des résidences secondaires par zone d'emploi : agrégation des
    comptages communaux du recensement (arrondissements PLM dédupliqués vers
    la commune parente), parts de catégories, croisement avec le taux de
    vacance structurelle LOVAC et l'indice de coût (corrélations de rangs,
    groupe « touristique » à plus de 20 % de RS, cumuls RS + vacance > 5 %).
  depends_on: [O-09, O-05, T-03, T-05]
  produced_by: src/logement/core/rs.py

- id: R-05
  type: result
  title: >
    Résidences secondaires × coût × vacance par zone d'emploi (297 ZE,
    recensement 2022) : part nationale 9,7 % (jusqu'à 65,5 % à Briançon) ;
    corrélations faibles avec la vacance structurelle (+0,17) et nulles
    avec l'indice de coût (−0,05) ; les 56 ZE à plus de 20 % de RS ont une
    vacance structurelle PLUS BASSE (médiane 2,6 % contre 3,3 %) ; 12 ZE
    cumulent RS > 20 % et vacance > 5 %, dont six corses (Corte 39 %/10,4 %)
    et des ZE rurales touristiques (Sarlat, Millau, Saint-Flour).
  depends_on: [T-06, V-01]
  produced_by: src/logement/shell/build.py
  output: data/processed/residences-secondaires-ze.json
  limitations: [L-05, L-06, L-09, L-10]

- id: I-05
  type: interpretation
  title: >
    À l'échelle des zones d'emploi, la part de résidences secondaires
    n'explique ni la vacance ni le coût : les grands marchés touristiques
    (stations alpines, littoral varois) gardent leur parc en usage — comme
    résidence secondaire précisément — et la « capacité saisonnière
    retirée » (INTRO §7) réside dans la catégorie RS elle-même et ses
    effets d'éviction infra-territoriaux, pas dans la vacance. Le cumul
    RS + vacance existe dans un sous-groupe corse et rural-touristique
    (R-05) — cas d'étude communaux pour la suite. Cette exploration a aussi
    permis de corriger l'identification des ZE à coût et vacance élevés de
    R-04 : ultramarines (La Réunion, Martinique), non corses.
  depends_on: [R-05, R-04, I-04]
  limitations: [L-10]

# ----------------------------------- branche taux d'effort (D-09, suite de H-03)

- id: C-04
  type: choice
  title: >
    Le taux d'effort à la relocation est construit sans ménage type
    (décision du 2026-08-05) : la surface du ménage est H-07 (m²/personne,
    S-12) × personnes, le revenu est MED_SL (€/UC/an, S-10) × UC, et le
    rapport ne fait donc intervenir que le ratio personnes/UC OBSERVÉ de
    chaque zone d'emploi (NUM_PER/NUM_CU, Filosofi). Un seul paramètre
    d'hypothèse (H-07), sensibilité par simple homothétie — le classement
    des ZE est invariant au choix de H-07.
  depends_on: [S-12, S-10, D-09]

- id: C-05
  type: choice
  title: >
    Le loyer de relocation d'une ZE est le mix appartement/maison des deux
    fichiers de la carte des loyers (S-09), pondéré par la composition
    maison/appartement des résidences principales de la ZE (S-11) — en ZE
    rurale on se reloge en maison (part maison médiane 74 % des RP par
    ZE). La variante appartement seul (numérateur de R-04) est publiée en
    sensibilité (décision du 2026-08-05).
  depends_on: [S-09, S-11]

- id: L-11
  type: limit
  title: >
    Limites du taux d'effort à la relocation : variante BRUTE de D-09
    (aucune source territoriale d'aides au logement — le taux net serait
    plus bas, surtout en bas de la distribution des revenus) ; le NIVEAU
    dépend linéairement de H-07 (51,2 m²/personne = parc moyen en place ;
    un ménage qui se reloge consomme plutôt la borne basse, 35 m²/personne
    chez les 30-39 ans) — seul le classement des ZE est invariant ; H-07
    est calibrée en France métropolitaine (S-12) et appliquée aux ZE de La
    Réunion/Martinique, dont le niveau est donc conventionnel ; premiers
    résultats S-12 qualifiés de provisoires ; hérite des limites loyers/
    revenus de L-09.
  depends_on: [S-12, D-09, H-07, L-09]

- id: O-10
  type: observation
  title: >
    Surface habitable moyenne par occupant des résidences principales,
    France métropolitaine 2020 : 51,2 m²/personne (49,7 en 2013), de 35
    m²/personne (personne de référence 30-39 ans) à 71 (75 ans et plus) ;
    surface moyenne des RP 93,2 m² (maisons 114,3, appartements 65,5).
  depends_on: [S-12]

- id: O-11
  type: observation
  title: >
    Loyers d'annonce prédits par commune pour les MAISONS (€/m², charges
    comprises), millésime 2025 — second fichier de la carte des loyers.
  depends_on: [S-09]

- id: O-12
  type: observation
  title: >
    Répartition maison/appartement des résidences principales par commune
    (P22_RPMAISON, P22_RPAPPART), recensement 2022.
  depends_on: [S-11, D-02]

- id: O-13
  type: observation
  title: >
    Nombre de personnes (NUM_PER) et d'unités de consommation (NUM_CU) par
    zone d'emploi 2020, Filosofi 2021 — le ratio personnes/UC observé par
    ZE (1,35-1,58, médiane 1,43).
  depends_on: [S-10]

- id: T-07
  type: transformation
  title: >
    Taux d'effort brut à la relocation par ZE : loyers appartement et
    maison moyennés par commune puis pondérés par le parc privé LOVAC,
    mixés selon la part maison des RP de la ZE (C-05) ; surface par UC =
    H-07 × ratio personnes/UC observé (C-04) ; effort = 12 × loyer_mix ×
    surface par UC / niveau de vie médian ; sensibilités (plage H-07 par
    homothétie, variante appartement seul) ; croisement avec le taux de
    vacance structurelle (agrégé min_count : les groupes tout-secret
    restent manquants, jamais zéro).
  depends_on: [O-04, O-05, O-07, O-08, O-10, O-11, O-12, O-13, C-03, C-04, C-05]
  produced_by: src/logement/core/effort.py

- id: R-06
  type: result
  title: >
    Taux d'effort brut à la relocation pour un ménage médian, par zone
    d'emploi (297 ZE, loyers 2025, revenus 2021, H-07 = 51,2 m²/personne,
    plage 35-71) : médiane 40,1 % (27,4-55,6 selon H-07), du minimum
    29,0 % (Avallon, Mayenne, Loches) au maximum 93,5 % (Paris) ; suivent
    L'Ouest-Réunion 85,1 %, Roissy 82,9 %, Menton 78,7 %, Le
    Sud-Martinique 77,4 % et les trois autres ZE réunionnaises ~75 % ;
    corrélation de Spearman effort × vacance structurelle −0,40 (vacance
    médiane 2,6 % dans la moitié à effort élevé contre 3,9 %) ; variante
    appartement seul : médiane 43,8 %, Spearman 0,959 avec le mix.
  depends_on: [T-07, H-07, V-01]
  produced_by: src/logement/shell/build.py
  output: data/processed/taux-effort-relocation-ze.json
  limitations: [L-05, L-06, L-09, L-11]

- id: I-06
  type: interpretation
  title: >
    Le taux d'effort donne à la tension de I-04 une grandeur interprétable
    et confirme sa géographie : se reloger aux loyers d'annonce courants
    coûterait au ménage médian ~40 % de son revenu dans la ZE médiane
    (~27 % à l'hypothèse de surface la plus favorable), plus des trois
    quarts à Paris et dans les DOM couverts — où la relocation est de fait
    hors de portée du ménage médian local (revenus faibles bien plus que
    loyers extrêmes, prolongement de I-04). L'anticorrélation avec la
    vacance persiste dans l'unité réaliste : la montée en réalisme
    (surface, composition des ménages, mix maison/appartement) ne change
    pas la lecture — le coût marque la tension, il n'explique pas la
    vacance. Ce résultat fournit le terme « coût de la mobilité
    résidentielle » pour l'instruction de H-04 (mobilités empêchées).
  depends_on: [R-06, I-04]
  limitations: [L-11]

# ------------------------------- branche tension et manque absolu (H-02 volume)

- id: C-06
  type: choice
  title: >
    Le test de tension de marché retient la VACANCE DISPONIBLE (vacance
    totale du recensement moins vacance structurelle LOVAC, hors marché
    par construction D-10) comparée au seuil de fluidité H-08. CORRECTION
    TRACÉE (2026-08-05) : le choix initial de la session (seuil sur la
    vacance totale, périmètre de la littérature D-15) échouait au contrôle
    de cohérence — la vacance totale du recensement est haute partout
    (médiane ZE 8,6 %) et aucune grande métropole TLV n'en sortait
    « tendue » (Paris 7,7 %, Lyon 7,2 %, Marseille 7,1 %) alors qu'elles
    cumulent zonage légal, loyers extrêmes et taux d'effort R-06
    maximaux ; en retranchant la structurelle, 7 de ces 8 métropoles
    repassent sous le seuil. Le test « vacance totale » reste publié en
    sensibilité dans R-07. Le besoin absolu de détente est chiffré en
    logements à rendre disponibles (M = seuil × parc − disponibles :
    mobiliser un logement structurellement vacant ajoute une unité
    disponible sans accroître le parc) et la couverture par le gisement
    est structurelle / besoin.
  depends_on: [S-11, S-13, D-10, D-14, D-15, H-08]

- id: L-12
  type: limit
  title: >
    Limites du croisement tension/manque : la vacance disponible mélange
    deux appareils de mesure (recensement parc entier vs LOVAC parc privé
    fiscal, L-06) — la vacance recensement surestime l'offre réellement
    disponible dans les centres denses (Paris commune : 9,8 % de vacance
    totale) donc le besoin des métropoles est plutôt SOUS-estimé ; la
    secrétisation LOVAC ampute le gisement communal agrégé (843 765
    structurels visibles contre ~1,15 M au national, L-05) donc la
    couverture est plutôt sous-estimée dans les petites ZE ; dans
    quelques ZE la structurelle LOVAC excède les vacants recensés
    (vacance disponible négative — Ajaccio, signalée dans l'artefact) ;
    le seuil H-08 est un ordre de grandeur d'usage professionnel
    (confiance basse) ; millésimes mélangés (recensement 2022, LOVAC 24,
    zonage TLV décembre 2025) ; « couverture » signifie que le volume
    existe, pas qu'il est mobilisable — la vacance structurelle est
    difficile à remobiliser par définition (C-01), et son état/coût de
    remise en usage n'est pas mesuré (H-05 non instruite).
  depends_on: [L-05, L-06, S-13, H-08]

- id: O-14
  type: observation
  title: >
    Zonage TLV par commune (S-13, décret n° 2025-1267 du 22/12/2025) :
