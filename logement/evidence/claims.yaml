# Graphe de preuves (méthode Métabolisme, INTRO §10) — les statuts hors
# registres : O observations, T transformations, M mesures, R résultats,
# I interprétations, V valeurs, C choix, P propositions, L limites.
# Chaque nœud référence ses dépendances par identifiant ; contrôle par
# `uv run logement validate` (références résolues, sorties présentes).

# ------------------------------------------------------------- valeurs et choix

- id: V-01
  type: value
  title: >
    Une résidence principale occupée est pleinement utilisée ; elle ne peut
    jamais être comptée comme capacité disponible ni comme inefficience
    (axiome, INTRO.md §3).

- id: C-01
  type: choice
  title: >
    La vacance durable au sens du cadrage (INTRO §6.2 : capacité
    potentiellement sortie de l'usage) est opérationnalisée par la convention
    administrative LOVAC « vacance structurelle = plus de 2 ans », le seuil
    étant paramétré en hypothèse (H-06, 1-3 ans). Attention au vocabulaire :
    la « vacance structurelle » du cadrage (difficilement mobilisable sans
    action lourde) est une notion plus exigeante, non mesurable avec les
    données actuelles (état du bâti absent).
  depends_on: [D-03, D-10, D-11]

- id: C-02
  type: choice
  title: >
    Ordre d'acquisition : séries nationales d'abord (S-01..S-03), puis LOVAC
    pour l'analyse territoriale.

- id: C-03
  type: choice
  title: >
    Millésime de référence LOVAC pour les taux : 24 (situation au
    01/01/2023), dernier millésime disposant du numérateur ET du dénominateur
    avant la rupture 2025 (constante REFERENCE_MILLESIME de core/lovac.py).
  depends_on: [S-05, L-04]

# ------------------------------------------------------------------ limites

- id: L-01
  type: limit
  title: >
    Séries nationales uniquement — aucune conclusion territoriale (« où »)
    n'est possible à ce stade ; attend LOVAC (C-02).

- id: L-02
  type: limit
  title: >
    Les années 2023-2025 de l'EAPL sont provisoires ; les millésimes ménages
    s'arrêtent en 2022, la dernière comparaison parc/ménages date donc de 2022.

- id: L-03
  type: limit
  title: >
    Ménage (recensement, D-05) et résidence principale (EAPL, D-02) sont des
    concepts appariés mais mesurés par des appareils différents ; écart
    observé ±0,3 % aux millésimes (voir R-01), et changement de concept au
    31/08/2025 (D-06) pour les millésimes futurs.
  depends_on: [D-02, D-05, D-06]

- id: L-04
  type: limit
  title: >
    Ruptures méthodologiques LOVAC : 2023 (disparition de la taxe
    d'habitation, passage à GMBI) et 2025 (données sources avant chaîne de
    traitement fiscale). Les niveaux de vacance totale ne sont pas
    comparables entre millésimes séparés par une rupture ; seule la série
    structurelle est raisonnablement robuste. COMPLÉTÉ le 2026-08-07
    (revue contradictoire) : le millésime de référence 24 (situation au
    01/01/2023) est le PREMIER post-GMBI — la campagne déclarative 2023 a
    été « chaotique » (82 % de déclarants seulement, hausse 2022→2023
    « bien plus marquée », risque de dégradation de la fiabilité LOVAC :
    S-22, pp. 13 et 21-22) ; l'ancienneté > 2 ans protège PARTIELLEMENT
    la série structurelle (les entrées en vacance ≤ 01/2021 sont
    pré-GMBI) ; le volume-titre de R-02 doit se lire sur le dernier
    millésime pré-rupture (~1,15 M au mill. 24), le mill. 26 (1,18 M)
    étant de source dégradée. Contrôle externe parisien : 32 091
    structurels LOVAC mill. 26 contre ~18 600 vacants > 2 ans du parc
    privé selon l'Apur (2022, S-24) — écart à instruire, prudence sur
    les volumes post-2023.
  depends_on: [S-05, S-22, S-24]

- id: L-05
  type: limit
  title: >
    Secrétisation LOVAC : la vacance structurelle communale est masquée
    (« s ») sous 11 logements vacants — 51 % des communes au millésime 26 ;
    les communes visibles au millésime 24 (20 % du total) portent 72,6 % de
    la vacance structurelle nationale. Échelle communale utilisable pour les
    volumes, pas pour une couverture exhaustive.
  depends_on: [S-05]

- id: L-06
  type: limit
  title: >
    LOVAC couvre le parc privé sur source fiscale — périmètre différent de la
    vacance INSEE/EAPL (parc entier, autre appareil de mesure) : les niveaux
    des deux chaînes ne se comparent pas directement.
  depends_on: [S-05, D-03, D-10]

- id: L-07
  type: limit
  title: >
    La dynamique d'emploi utilisée est structurelle (1998-2018, S-07),
    pas conjoncturelle. CORRIGÉ le 2026-08-07 (revue contradictoire) :
    l'énoncé initial (« dernière publication à cette maille », millésimes
    récents au département seulement) est PÉRIMÉ — les estimations
    annuelles d'emploi localisées de l'INSEE existent à la maille zone
    d'emploi jusqu'en 2023 (définitif) / 2024 (provisoire). R-03 reste
    calculé sur 1998-2018 ; la re-exécution en variante récente est
    planifiée (NEXT-STEPS, source à figer en S-xx à la prochaine
    session) — jusque-là, la lecture « dynamique d'emploi » de R-03/I-03
    s'entend comme structurelle, aveugle aux retournements post-2018.
  depends_on: [S-07]

- id: L-08
  type: limit
  title: >
    Agrégats ZE de vacance minorés par la secrétisation communale (L-05) —
    surtout dans les petites ZE rurales — et une commune LOVAC non appariée
    à la table 2026 (97127) exclue de l'agrégation.
  depends_on: [S-05, S-06, L-05]

