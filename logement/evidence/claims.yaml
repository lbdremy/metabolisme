  depends_on: [S-07, D-07]

# ------------------------------------------------------------ transformations

- id: T-01
  type: transformation
  title: >
    Lecture et normalisation des fichiers figés : libellés (espaces
    insécables), années provisoires « (p) », lignes de niveau catégorie,
    invariant de sommation (catégories = ensemble, tolérance 1 millier).
  depends_on: [O-01, O-02, O-03]
  produced_by: src/logement/core/parc.py

- id: T-02
  type: transformation
  title: >
    Indexation base 100 (première année commune, 1982), taux de croissance
    annuels moyens par période intercensitaire, parts de catégories dans
    l'ensemble du parc.
  depends_on: [T-01]
  produced_by: src/logement/core/parc.py

- id: T-03
  type: transformation
  title: >
    Lecture des fichiers LOVAC (cp1252, « s » de secret → valeur manquante,
    séparateurs de milliers insécables, millésimes normalisés à 4 chiffres),
    agrégation des arrondissements PLM en communes (avec propagation du
    secret), calcul des taux de vacance structurelle au millésime de
    référence (C-03).
  depends_on: [O-04, C-03]
  produced_by: src/logement/core/lovac.py

- id: T-04
  type: transformation
  title: >
    Croisement vacance × emploi par zone d'emploi : agrégation de la vacance
    structurelle communale LOVAC par ZE 2020 (arrondissements PLM ramenés à
    leur commune parente — la feuille COM de S-06 ne les contient pas),
    dynamique d'emploi 1998-2018 en taux annuel moyen, corrélation de rangs.
  depends_on: [O-04, O-05, O-06, T-03]
  produced_by: src/logement/core/ze.py

# ------------------------------------------------------------------- résultats

- id: R-01
  type: result
  title: >
    Comparaison parc / ménages / population 1982-2025 : indices au dernier
    millésime commun (2022 : logements 156,2 · ménages 155,2 · population
    121,9), trajectoire de la vacance (7,9 % en 1982, minimum 6,2 % en 2005,
    7,7 % en 2025 ; 1 895 → 2 962 milliers), part des résidences secondaires
    (9,5 % → 9,8 %), croissances annuelles par période, écart RP/ménages aux
    millésimes (±0,3 %).
  depends_on: [T-02, V-01]
  produced_by: src/logement/shell/build.py
  output: data/processed/parc-menages.json
  limitations: [L-01, L-02, L-03]

- id: R-02
  type: result
  title: >
    Vacance structurelle du parc privé : 1,18 M de logements au millésime 26
    (~1,1-1,2 M stables sur 2020-2026), taux national 3,5 % au millésime 24,
    gradient départemental d'un ordre de grandeur (DOM 10-27 % et diagonale
    des faibles densités 7-9,5 % contre 1,4-1,7 % en zones tendues), volumes
    concentrés dans les grandes villes (Paris 32 091, Marseille 14 529, PLM
    agrégées) à des taux proches de la moyenne, statistiques de
    secrétisation communale.
  depends_on: [T-03, H-06, V-01]
  produced_by: src/logement/shell/build.py
  output: data/processed/vacance-structurelle.json
  limitations: [L-04, L-05, L-06]

- id: R-03
  type: result
  title: >
    Vacance structurelle × dynamique d'emploi par zone d'emploi (millésime
    LOVAC 24, emploi 1998-2018, 305 ZE) : corrélation de Spearman −0,36 ;
    les 63 ZE à emploi déclinant portent 15,1 % de la vacance structurelle
    pour 9,8 % du parc privé (taux médian 4,5 % contre 2,9 % ailleurs) ;
    84,9 % de la vacance structurelle se situe dans des ZE où l'emploi
    croît (Paris 69 803, Marseille 17 917, Lyon 12 099).
  depends_on: [T-04, H-06, V-01]
  produced_by: src/logement/shell/build.py
  output: data/processed/vacance-emploi-ze.json
  limitations: [L-05, L-06, L-07, L-08]

# -------------------------------------------------------------- interprétations

- id: I-01
  type: interpretation
  title: >
    Sur 40 ans le parc suit les ménages (et non la population) : la croissance
    du parc accompagne la décohabitation. Le régime change vers 2005-2006 :
    avant, les ménages croissent plus vite que le parc et la vacance se
    résorbe ; après, le parc croît plus vite et la vacance remonte — au niveau
    national, la capacité hors résidence principale qui augmente depuis 2006
    est de la vacance, pas des résidences secondaires.
  depends_on: [R-01]
  limitations: [L-01, L-02]

- id: I-02
  type: interpretation
  title: >
    « Où est la vacance » a deux réponses : en intensité, les taux élevés
    sont ultramarins et ruraux (diagonale des faibles densités) — premier
    indice cohérent avec H-02 (capacités mal localisées) ; en volume, les
    grandes villes dominent à des taux proches de la moyenne. Tout mécanisme
    de remise en usage devra traiter ces deux régimes distincts.
  depends_on: [R-02]
  limitations: [L-05, L-06]

- id: I-03
  type: interpretation
  title: >
    L'hypothèse directrice H-02 (capacités mal localisées) est confirmée en
    intensité — la vacance structurelle est sur-représentée (×1,5) et deux
    fois plus fréquente dans les ZE à emploi déclinant — mais réfutée comme
    explication dominante en volume : ~85 % de la vacance structurelle se
    trouve dans des zones d'emploi où l'emploi croît. La majorité de la
    capacité sortie d'usage coexiste donc avec la demande — les causes de
    blocage sont à chercher ailleurs (état du bâti, successions, coût,
    inadéquation infra-ZE : H-03, H-05).
  depends_on: [R-03]
  limitations: [L-07, L-08]
