    contradictoire) ; l'ancienneté n'est significativement au-dessus
    que de F+G (+0,40 [0,30 ; 0,49]). Le proxy énergie converge — part
    F+G des diagnostiqués médiane 10,9 %, Spearman 0,62 avec
    l'ancienneté ; couverture de diagnostic × vacance −0,14 (le parc
    des ZE à forte vacance est MOINS diagnostiqué : le 0,40 est plutôt
    une borne basse, L-13) ; les têtes des deux classements sont la
    diagonale rurale (Avallon 52,4 % d'avant-1946 ; Ussel 37,3 % de
    F+G). CONTRASTE DOM : vacance médiane 11,0 % sur un bâti récent
    (avant-1946 médian 1,9 %) et pourvu du confort sanitaire (inconfort
    médian 1,9 %, Spearman inconfort × vacance 0,27 sur 17 ZE) —
    l'état du bâti n'explique pas la vacance ultramarine.
