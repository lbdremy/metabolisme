    Au périmètre des seules communes TLV (le périmètre légal de la
    tension, D-14), la couverture nationale tombe de 1,06 à 0,69 : le
    gisement durable des ZE tendues est majoritairement HORS des
    communes tendues. Contrôles externes convergents (S-22) : la Cour
    des comptes compte 118 330 vacants > 2 ans dans les communes TLV en
