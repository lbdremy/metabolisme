title: Le parc immobilier français, au bord du compte
subtitle: "Capacité à peine suffisante, mobilité en chute : l'état des preuves."
date: 2026-08-10
summary: >
  La France compte 38,4 millions de logements dont 2,96 millions vacants.
  Faut-il « remplir les logements vides » ou construire massivement ? Premier
  état des preuves de l'étude sur l'efficacité du parc immobilier français :
  le stock a suivi les ménages, la vacance durable est là où l'emploi croît,
  le gisement couvre à peine le besoin — et la mobilité résidentielle chute
  partout.
