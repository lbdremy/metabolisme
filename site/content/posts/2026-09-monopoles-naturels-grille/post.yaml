slug: 2026-09-monopoles-naturels-grille
title: Reconnaître une rente de position
subtitle: "Monopoles naturels, ressources fixes, et ce que collectiviser une rente veut dire."
date: 2026-09-05
summary: >
  Dans le logement, l'énergie, l'eau, le transport, les télécommunications,
  le prix payé par l'usager rémunère-t-il une production ou une position ?
  Article de cadrage de la deuxième étude Métabolisme, réécrit après une
  revue contradictoire : ce qu'est un monopole naturel et ce qui n'en est
  pas un, deux rentes à ne pas confondre, une définition mesurable de la
  rente, une grille en quatre questions qui sait répondre « non », la part
  normative isolée, douze objets classés comme hypothèses, et le gabarit
  des études sectorielles qui mesureront le surprofit, son attribution et
  son destinataire.
study:
  slug: monopoles
  name: Monopoles naturels, rentes de position et collectivisation des rentes
  question: >
    Dans quels secteurs le prix payé par l'usager rémunère-t-il une position
    plutôt qu'une production ; à qui cette rente revient-elle aujourd'hui, de
    combien est-elle, que coûte-t-elle à la collectivité ; et sous quelles
    formes institutionnelles pourrait-elle revenir à l'usager, pour quel gain
    et avec quelle part laissée au privé ?
  dir: monopoles
