  # --------------------------------------------------------- définitions
  - id: D-01
    type: definition
    term: logement locatif social (champ RPLS)
    definition: >
      Ensemble des logements, conventionnés ou non, des bailleurs des
      catégories suivantes : offices publics de l'habitat (OPH), entreprises
      sociales pour l'habitat (ESH), associations agréées ; plus les
      logements conventionnés des sociétés d'économie mixte (SEM) agréées.
    depends_on: [S-01]
    caveats:
      - "Hors champ RPLS : les logements sociaux d'autres acteurs (collectivités, État, grandes entreprises, associations), environ 9 % de l'ensemble des logements sociaux d'après l'enquête Logement 2020 ; les logements-foyers, foyers de travailleurs et résidences sociales."
      - L'enquête Logement (S-02, S-04) retient une définition déclarative, plus large.
      - Le 15,9 % rapporte les logements sociaux LOUÉS aux résidences principales du recensement 2022 — deux millésimes différents.
  - id: D-02
    type: definition
    term: taux d'effort en logement, net des aides (Insee)
    definition: >
      Rapport des dépenses liées à l'habitation principale aux revenus. Pour
      les locataires, les dépenses comprennent loyers et charges locatives ;
      pour tous les ménages, eau, énergie (nettes des aides) et assurance
      habitation. Le taux d'effort est net, c'est-à-dire calculé en déduisant
      des dépenses les aides au logement. Le revenu retenu est le revenu
      disponible hors aides au logement, sans déduire la taxe d'habitation.
    depends_on: [S-04]
    caveats:
      - Les valeurs citées sont des MÉDIANES (la moitié des ménages est au-dessus), pas des moyennes.
      - Champ France métropolitaine, ménages en logement ordinaire, hors logés gratuitement et revenus négatifs ou nuls.
      - L'Insee dit « secteur libre », pas « parc privé ».
  - id: D-03
    type: definition
    term: Miete inkl. Betriebskosten pro m² (Statistik Austria)
    definition: >
      Loyer net (TVA comprise) plus charges d'exploitation (Betriebskosten,
      TVA comprise), rapporté à la surface utile (Nutzfläche) du logement,
      par mois ; hors chauffage et eau chaude, hors garage ou place de
      stationnement. Champ : locations principales (Hauptmiete) à loyer net
      positif, logements municipaux et coopératifs compris.
    depends_on: [S-07]
    caveats:
      - Non comparable terme à terme avec un loyer « hors charges » français (S-08) — la note le signale (L-03).
      - Rupture de série au premier trimestre 2021.

