  # ------------------------------------------------------ interprétations
  - id: I-01
    type: interpretation
    title: >
      Le parc social loge des ménages plus pauvres dans des logements moins
      chers, mais avec un taux d'effort proche de celui du secteur libre
      (3 points d'écart en médiane) : il ne fait pas baisser le prix du
      logement pour ceux qu'il loge, il ajuste le loyer au revenu.
    depends_on: [O-05, O-06, O-07, O-08]
    limitations: [L-05]
  - id: I-02
    type: interpretation
    title: >
      Ce qui distingue Vienne, c'est le statut de son parc — universel
      (plafonds hauts), inaliénable (jamais vendu), adossé à une cotisation
      dédiée — plus que sa taille : c'est ce statut qui lui donne une
      fonction régulatrice sur les loyers de toute la ville. Le parc
      français, réservé et moins cher, loge sans réguler.
    depends_on: [O-09, O-10, O-11, O-12, O-13, O-14, O-15, O-16, O-17, O-18, I-01]
    limitations: [L-03, L-04]

  # --------------------------------------------------------------- limites
  - id: L-01
    type: limit
    title: >
      Aucune des sources ne classe les pays européens par VOLUME de logements
      sociaux : le Panorama Ancols compare des PARTS de résidences principales
      (France 5e sur 22). « Un des plus gros parcs d'Europe » n'est pas
      établi ici. Incohérence interne du Panorama : 14,0 % (OCDE) contre 15 %
      (Fidéli 2022) pour la France.
    depends_on: [O-03, O-04]
  - id: L-02
    type: limit
    title: >
      Le « 60 % des habitants » du message initial ne figure sur aucune page
      de socialhousing.wien (anglais ou allemand) ; la Ville dit « around 50
      percent » (« über 50 Prozent » en allemand). Ce chiffre est affirmé par
      la Ville elle-même, sans source statistique citée.
    depends_on: [O-09]
  - id: L-03
    type: limit
    title: >
      Vienne et Paris ne sont pas mesurés de la même façon : 9,8 €/m² est
      charges et TVA comprises, tous statuts (municipal, coopératif, privé),
      sur surface utile (Mikrozensus) ; 25,5 €/m² est hors charges, parc privé
      non meublé seulement (enquête OLAP). Le loyer net viennois est de
      7,2 €/m² ; le loyer du seul parc privé viennois n'est pas publié
      (Autriche entière : 11,1 €/m² charges comprises). L'écart réel est donc
      PLUS grand que ne le dit la comparaison, pas plus petit.
    depends_on: [O-11, O-12, D-03]
  - id: L-04
    type: limit
    title: >
      Le Wohnbauförderungsbeitrag n'est pas « le » financement du logement
      viennois : c'est une recette du Land, affectée depuis 2026 au logement
      ET aux infrastructures sociales ; ni la page de la Ville ni la loi ne
      disent quelle part du financement du parc il représente. Le taux de
      1,5 % ne vaut qu'à partir du 1er janvier 2026 (1 % avant) ; l'assiette
      est la base de cotisation sociale, plafonnée, avec des exemptions
      (apprentis, emplois marginaux…) — pas « la masse salariale ».
    depends_on: [O-17, O-18]
  - id: L-05
    type: limit
    title: >
      Les 418 € / 607 € datent de 2020 (enquête Logement, France
      métropolitaine, hors meublés) et comparent des parcs de composition
      différente ; ils ne se combinent pas avec le stock RPLS 2025 (France
      entière) ni avec les taux d'effort 2023 (SRCV) sans changer de source,
      de millésime et de champ.
    depends_on: [O-05, O-07]
  - id: L-06
    type: limit
    title: >
      Le « 75 % » ne porte que sur le critère de revenu ; la version allemande
      dit « environ 75 % gagnent moins que la moyenne ». Les autres conditions
      d'accès (18 ans, deux ans de résidence principale à Vienne, citoyenneté
      ou équivalent) n'y sont pas intégrées.
    depends_on: [O-15]
